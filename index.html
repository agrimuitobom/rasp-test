<title>ブレッドボード配線ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
/* Layout: 部品パレット｜作業マット（SVG）｜インスペクタ。静電気防止マットを思わせる緑灰色の作業面に、実物色の基板を置く */
:root{
  --bg:#e7ecea; --panel:#f8faf9; --panel2:#eef3f1; --line:#d0dad6; --fg:#16201d; --muted:#5a6964;
  --accent:#0b6e69; --accent-ink:#ffffff; --accent-soft:#d6ebe8;
  --mat:#cddad5; --dot:#adc0b9; --sel:#ff7a00; --hl:#00a37a;
  --err:#c8323a; --warn:#a86f00; --info:#2a64a8; --ok:#22804e;
  --err-bg:#fbe9ea; --warn-bg:#fbf1dc; --info-bg:#e6eef9; --ok-bg:#e3f3ea;
  --pin-gpio:#1d7444; --pin-3v3:#b95300; --pin-5v:#c22a2a; --pin-gnd:#2b2b2b;
  --code-bg:#fbfcfb; --code-fg:#1b2420; --code-ln:#9aa8a3; --code-gut:#eef3f1;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --panel:#161e1c; --panel2:#1b2523; --line:#2a3633; --fg:#e3ebe9; --muted:#93a39e;
    --accent:#3cc0b3; --accent-ink:#04201d; --accent-soft:#163a36;
    --mat:#18221f; --dot:#2b3a36; --sel:#ff9a3c; --hl:#38e0b0;
    --err:#ff6f74; --warn:#f0b429; --info:#6fa9ee; --ok:#52c488;
    --err-bg:#3a1c1e; --warn-bg:#382b10; --info-bg:#172a42; --ok-bg:#163223;
    --pin-gpio:#62d394; --pin-3v3:#ffa94d; --pin-5v:#ff7070; --pin-gnd:#c7d0cd; --code-bg:#0f1715; --code-fg:#e3ebe9; --code-ln:#5f726c; --code-gut:#131d1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#161e1c; --panel2:#1b2523; --line:#2a3633; --fg:#e3ebe9; --muted:#93a39e;
  --accent:#3cc0b3; --accent-ink:#04201d; --accent-soft:#163a36;
  --mat:#18221f; --dot:#2b3a36; --sel:#ff9a3c; --hl:#38e0b0;
  --err:#ff6f74; --warn:#f0b429; --info:#6fa9ee; --ok:#52c488;
  --err-bg:#3a1c1e; --warn-bg:#382b10; --info-bg:#172a42; --ok-bg:#163223;
  --pin-gpio:#62d394; --pin-3v3:#ffa94d; --pin-5v:#ff7070; --pin-gnd:#c7d0cd; --code-bg:#0f1715; --code-fg:#e3ebe9; --code-ln:#5f726c; --code-gut:#131d1b;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand h1 b{color:var(--accent)}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tb:hover{border-color:var(--accent)}
.tb:focus-visible,.pal-item:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb[disabled]{opacity:.4;cursor:default}
.tb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.swatches{display:flex;gap:4px;align-items:center;padding:0 6px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.swatches small{color:var(--muted);font-size:11px;margin-right:2px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw.on{border-color:var(--fg)}

.main{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:10px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.palette{overflow:auto;padding:10px}
.pal-group{margin-bottom:12px}
.pal-group h3{margin:4px 4px 6px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.pal-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px;cursor:grab;touch-action:none;user-select:none}
.pal-item:hover{background:var(--panel2);border-color:var(--line)}
.pal-item i{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-style:normal;font:600 9px var(--mono);color:#fff}
.pal-item div{min-width:0}
.pal-item b{display:block;font-size:13px;font-weight:500;line-height:1.25}
.pal-item small{display:block;font-size:11px;color:var(--muted);line-height:1.25}

.stage{position:relative;overflow:hidden;background:var(--mat)}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.panning{cursor:grabbing}
.hint{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.hint button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0 2px}
.tip{position:absolute;pointer-events:none;background:#101614;color:#f2f6f4;border-radius:6px;padding:5px 8px;font-size:12px;line-height:1.4;max-width:260px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{font-family:var(--mono);font-weight:600}
.zoomer{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.stepbar{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.stepbar .no{font:600 13px var(--mono);color:var(--accent);white-space:nowrap}
.stepbar .no big{display:block;font-size:26px;line-height:1;color:var(--fg)}
.stepbar .txt{font-size:16px;font-weight:500;line-height:1.45;min-width:0}
.stepbar .txt small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:3px}
.stepbar .nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.side{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px}
.tab{flex:1;border:0;background:none;padding:8px 4px 9px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;color:var(--muted);position:relative;white-space:nowrap}
.tab.on{color:var(--fg);font-weight:700;background:var(--panel2)}
.tab .bd{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;font:600 10px/16px var(--mono);color:#fff;margin-left:3px;vertical-align:1px}
.bd.e{background:var(--err)} .bd.w{background:var(--warn)}
.tabbody{overflow:auto;padding:14px;min-height:0;background:var(--panel2)}
.tabbody h2{font-size:15px;margin:0 0 4px;text-wrap:balance}
.tabbody h4{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px}
textarea{resize:vertical;min-height:64px}
textarea.code{font:12px/1.4 var(--mono);min-height:84px;word-break:break-all}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
.pinlist{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.pinlist li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:8px;font-size:12.5px;padding:6px 8px;background:var(--panel);border-radius:6px;border:1px solid var(--line)}
.pinlist li b{font-family:var(--mono);font-weight:600;font-size:12px}
.pinlist li span{color:var(--muted);text-align:right;min-width:0}
.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.5;cursor:pointer;border:1px solid transparent}
.res li:hover{border-color:var(--line)}
.res li .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px var(--mono);margin-top:1px}
.res .error{background:var(--err-bg)} .res .error .ic{background:var(--err)}
.res .warn{background:var(--warn-bg)} .res .warn .ic{background:var(--warn)}
.res .info{background:var(--info-bg)} .res .info .ic{background:var(--info)}
.res .ok{background:var(--ok-bg)} .res .ok .ic{background:var(--ok)}
.summary{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:500}
.pill.e{background:var(--err-bg);color:var(--err)} .pill.w{background:var(--warn-bg);color:var(--warn)}
.pill.i{background:var(--info-bg);color:var(--info)} .pill.o{background:var(--ok-bg);color:var(--ok)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--ok)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12.5px;line-height:1.45}
.steps li.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.steps li .n{font:600 13px var(--mono);color:var(--accent);text-align:center;padding-top:1px}
.steps li .nt{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps li .mv{display:flex;flex-direction:column;gap:2px}
.steps li .mv button{border:1px solid var(--line);background:var(--panel2);border-radius:4px;width:24px;height:20px;cursor:pointer;font-size:10px;line-height:1;padding:0}
.help{margin:0;padding-left:18px;display:grid;gap:5px;font-size:12.5px;line-height:1.5}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
.cmp-row{font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.cmp-row b{font-weight:700}
.cmp-row .tag{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:1px 2px;display:inline-block}

/* SVG */
#cv .mat{fill:url(#dots)}
#cv .dotc{fill:var(--dot)}
.slk{font:600 7.5px var(--mono);fill:#fff}
.bbtxt{font:500 9px var(--mono);fill:#8d897e}
.bbsym{font:700 14px var(--mono)}
.pilab{font:600 8.5px var(--mono)}
.pilab.out.nc{fill:var(--muted)} .pilab.out.gpio{fill:var(--pin-gpio)} .pilab.out.v33{fill:var(--pin-3v3)} .pilab.out.v5{fill:var(--pin-5v)} .pilab.out.gnd{fill:var(--pin-gnd)}
.pilab.in{fill:#eaf7ef} .pilab.in.v5{fill:#ffc2c2} .pilab.in.v33{fill:#ffd9a8} .pilab.in.gnd{fill:#b9c9c0}
.pinno{font:700 10px var(--mono);fill:var(--muted)}
#cv.nolabels .pilab,#cv.nolabels .pinno{display:none}
.tagtxt{font:700 10px var(--mono);fill:#333}
.part{cursor:move}
.part .pm{fill:none;stroke:var(--hl);stroke-width:1.5;opacity:0;pointer-events:none}
.part:hover .pm{opacity:.9}
.part.sel{filter:drop-shadow(0 0 2px var(--sel)) drop-shadow(0 0 5px var(--sel))}
.part.flash,.wire.flash{animation:flash 1.4s ease-in-out 2}
@keyframes flash{50%{filter:drop-shadow(0 0 3px var(--err)) drop-shadow(0 0 8px var(--err))}}
.wire{cursor:pointer}
.wire .hit{stroke:transparent;stroke-width:14;fill:none}
.wire .ol{fill:none;stroke-linecap:round;stroke:rgba(0,0,0,.45)}
.wire .core{fill:none;stroke-linecap:round}
.wire .shine{fill:none;stroke:rgba(255,255,255,.35);stroke-linecap:round;pointer-events:none}
.wire.sel .ol{stroke:var(--sel)}
.wire.hlw .ol{stroke:var(--hl)}
.wend{fill:#b8bec3;stroke:#5d646a;stroke-width:1.5;cursor:grab}
.wire.sel .wend{stroke:var(--sel);stroke-width:2.5}
.hlring{fill:none;stroke:var(--hl);stroke-width:2.5}
.hlfill{fill:var(--hl);opacity:.25}
.preview{fill:none;stroke-width:5;stroke-linecap:round;opacity:.85;stroke-dasharray:8 5;pointer-events:none}
.stepping .fut{display:none}
.stepping .past{opacity:.45}
.stepping .cur{filter:drop-shadow(0 0 3px var(--sel)) drop-shadow(0 0 7px var(--sel));animation:pulse 1.6s ease-in-out infinite}
.stepping .wend{cursor:default}
@keyframes pulse{50%{filter:drop-shadow(0 0 1px var(--sel)) drop-shadow(0 0 3px var(--sel))}}
@media (prefers-reduced-motion: reduce){.stepping .cur,.part.flash,.wire.flash{animation:none}}

.fx{pointer-events:none}
.bub.ok{fill:#1d7444} .bub.ng{fill:#69736f} .bub.tap{fill:var(--accent)}
.bubt{font:700 12px var(--ui);fill:#fff}
.lcdt{font:600 34px var(--mono);fill:#eef4ff}
.oledt{font:600 18px var(--mono);fill:#9fe3ff}
.pibadge{font:700 10px var(--mono);fill:#fff}
.ringfx{animation:ringfx .45s ease-in-out infinite}
@keyframes ringfx{50%{opacity:.25}}
#cv.running .part{cursor:default}
#cv.running .part[data-type="button"]{cursor:pointer}
#cv.running .wire,#cv.running .wend{cursor:default}
.tb.run{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.tb.run.on{background:var(--err);border-color:var(--err)}
.gpio{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:6px}
.gpio select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 8px}
.gh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.gh b{font:600 13px var(--mono)}
.gd{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font:700 11px var(--mono);padding:2px 7px;border-radius:999px;color:#fff;background:#8a8f93;white-space:nowrap}
.lvl.hi{background:#d6363b} .lvl.lo{background:#2f62c9} .lvl.pwm{background:#8e44ad} .lvl.err{background:#ff2a2a}
.rng{display:grid;grid-template-columns:4.5em minmax(0,1fr) 4.8em;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.gpio .rng{grid-template-columns:minmax(0,1fr) 3.5em}
.rng span{font:600 12px var(--mono);text-align:right}
.rng input{width:100%;accent-color:var(--accent)}
.ra{font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;margin-top:6px}
.ra.error{background:var(--err-bg);color:var(--err);font-weight:700} .ra.warn{background:var(--warn-bg);color:var(--warn)} .ra.info{background:var(--info-bg);color:var(--info)}
.main.wide{grid-template-columns:200px minmax(0,1fr) 460px}
.seg{display:flex;gap:2px;background:var(--line);padding:3px;border-radius:9px;margin:8px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.codebar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.codebar select{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);height:300px}
.editor .ln{font:12.5px/1.6 var(--mono);color:var(--code-ln);text-align:right;padding:10px 8px 10px 10px;overflow:hidden;user-select:none;background:var(--code-gut);min-width:2.6em}
.editor .ln span{display:block}
.editor .ln span.e{color:#fff;background:var(--err);border-radius:3px}
.editor textarea{border:0;outline:none;resize:none;background:transparent;color:var(--code-fg);font:12.5px/1.6 var(--mono);padding:10px;white-space:pre;overflow:auto;min-height:0;height:100%;tab-size:4}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.console{font:12px/1.55 var(--mono);background:#0e1513;color:#d6e4df;border-radius:10px;padding:8px 10px;height:150px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.console .sys{color:#7fb8a8} .console .err{color:#ff8a8f} .console .hint{color:#ffd27a} .console .warn{color:#ffd27a}
@media (max-width: 1000px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .main,.main.wide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto}
  .palette{display:flex;gap:8px;overflow-x:auto;padding:8px}
  .pal-group{display:flex;gap:4px;margin:0;flex:none;align-items:stretch}
  .pal-group h3{writing-mode:vertical-rl;margin:0 2px;font-size:10px}
  .pal-item{width:auto;flex:none}
  .pal-item small{display:none}
  .side{max-height:none}
  .tabbody{max-height:none}
  .stepbar{grid-template-columns:minmax(0,1fr);}
  .stepbar .nav{justify-content:flex-start}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>配線<b>ラボ</b></h1><span>Raspberry Pi × ブレッドボード</span></div>
    <div class="tools" id="tools">
      <button class="tb" id="bUndo" title="元に戻す（Ctrl+Z）" aria-label="元に戻す">↶</button>
      <button class="tb" id="bRedo" title="やり直す（Ctrl+Y）" aria-label="やり直す">↷</button>
      <span class="sep"></span>
      <button class="tb" id="bRot" title="回転（R）">回転</button>
      <button class="tb" id="bDel" title="削除（Delete）">削除</button>
      <span class="sep"></span>
      <div class="swatches" id="swatches" title="新しいジャンパ線の色"><small>線の色</small></div>
      <button class="tb on" id="bLabels" title="ラズパイのピン名を表示">ピン名</button>
      <button class="tb" id="bSteps" title="手順モード">手順モード</button>
      <button class="tb run" id="bRun" title="回路を動かしてみる">▶ 動かす</button>
    </div>
  </header>

  <div class="main">

<script>
"use strict";
const P = 20; // 0.1インチ = 20px
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K = (x,y) => x + ',' + y;
function rotXY(dx,dy,r){ switch(((r%4)+4)%4){case 0:return [dx,dy];case 1:return [-dy,dx];case 2:return [-dx,-dy];default:return [dy,-dx];} }

/* ===================== ラズパイのピン ===================== */
const PI_NAMES = {1:'3V3',2:'5V',3:'GPIO2',4:'5V',5:'GPIO3',6:'GND',7:'GPIO4',8:'GPIO14',9:'GND',10:'GPIO15',11:'GPIO17',12:'GPIO18',13:'GPIO27',14:'GND',15:'GPIO22',16:'GPIO23',17:'3V3',18:'GPIO24',19:'GPIO10',20:'GND',21:'GPIO9',22:'GPIO25',23:'GPIO11',24:'GPIO8',25:'GND',26:'GPIO7',27:'GPIO0',28:'GPIO1',29:'GPIO5',30:'GND',31:'GPIO6',32:'GPIO12',33:'GPIO13',34:'GND',35:'GPIO19',36:'GPIO16',37:'GPIO26',38:'GPIO20',39:'GND',40:'GPIO21'};
const GPIO_ALT = {2:'SDA',3:'SCL',4:'1-Wire',14:'TXD',15:'RXD',18:'PWM0',12:'PWM0',13:'PWM1',19:'PWM1',10:'MOSI',9:'MISO',11:'SCLK',8:'CE0',7:'CE1',0:'ID_SD',1:'ID_SC'};
const PI_PINS = [];
for (let n=1;n<=40;n++){
  const name = PI_NAMES[n];
  const role = name==='3V3'?'3v3':name==='5V'?'5v':name==='GND'?'gnd':'gpio';
  const gpio = role==='gpio'? +name.slice(4) : null;
  const alt = gpio!==null && GPIO_ALT[gpio] ? GPIO_ALT[gpio] : '';
  const disp = role==='3v3'?'3.3V':name;
  PI_PINS.push({x:Math.floor((n-1)/2), y:n%2?1:0, num:n, name:disp, role, gpio, alt,
    label:`${n}番ピン（${disp}${alt?'・'+alt:''}）`});
}
const PIN_CLS = {gpio:'gpio','3v3':'v33','5v':'v5',gnd:'gnd',nc:'nc'};
const PIN_COL = {gpio:'#2fa865','3v3':'#f08a1c','5v':'#e53935',gnd:'#111',nc:'#8a8f93'};
const PICO_NAMES = {1:'GP0',2:'GP1',3:'GND',4:'GP2',5:'GP3',6:'GP4',7:'GP5',8:'GND',9:'GP6',10:'GP7',11:'GP8',12:'GP9',13:'GND',14:'GP10',15:'GP11',16:'GP12',17:'GP13',18:'GND',19:'GP14',20:'GP15',21:'GP16',22:'GP17',23:'GND',24:'GP18',25:'GP19',26:'GP20',27:'GP21',28:'GND',29:'GP22',30:'RUN',31:'GP26',32:'GP27',33:'GND',34:'GP28',35:'ADC_VREF',36:'3V3(OUT)',37:'3V3_EN',38:'GND',39:'VSYS',40:'VBUS'};
const PICO_PINS = [];
for (let n=1;n<=40;n++){
  const name=PICO_NAMES[n];
  const role = name==='GND'?'gnd': name==='3V3(OUT)'?'3v3': (name==='VSYS'||name==='VBUS')?'5v': name.startsWith('GP')?'gpio':'nc';
  const gpio = role==='gpio'? +name.slice(2) : null;
  const alt = gpio===26?'ADC0':gpio===27?'ADC1':gpio===28?'ADC2':'';
  PICO_PINS.push({x:n<=20?n-1:40-n, y:n<=20?7:0, num:n, name, role, gpio, alt, label:`${n}番ピン（${name}${alt?'・'+alt:''}）`});
}
function picoDraw(){
  let s=`<rect x="-44" y="52" width="40" height="36" rx="4" fill="#c4c9cd" stroke="#8a9096"/>`;
  s+=`<rect x="-14" y="-14" width="408" height="168" rx="10" fill="#1e7d3c" stroke="#135a2a" stroke-width="2"/>`;
  s+=`<rect x="300" y="18" width="78" height="104" rx="4" fill="#c8cdd1" stroke="#8a9096"/><text x="339" y="74" text-anchor="middle" style="font:700 12px var(--mono)" fill="#5c6267">Pico W</text>`;
  s+=`<rect x="150" y="45" width="54" height="54" rx="3" fill="#1d1d1d"/><text x="177" y="76" text-anchor="middle" style="font:600 8px var(--mono)" fill="#9aa">RP2040</text>`;
  s+=`<circle cx="70" cy="40" r="11" fill="#f4f4f4" stroke="#aaa"/><text x="70" y="62" text-anchor="middle" class="slk" style="font-size:6.5px">BOOTSEL</text>`;
  s+=`<rect x="10" y="26" width="12" height="7" rx="1" fill="#9be7a8"/><text x="16" y="44" text-anchor="middle" class="slk" style="font-size:6.5px">LED</text>`;
  s+=`<text x="100" y="118" fill="#e9f6ee" style="font:700 15px var(--ui)">Raspberry Pi Pico W</text>`;
  for (const q of PICO_PINS){
    const cx=q.x*P, cy=q.y*P;
    s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#1e7d3c" stroke="${PIN_COL[q.role]}" stroke-width="2.6"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#e0bf55"/>`;
    const lab = q.alt ? `${q.name} ${q.alt.replace('ADC','A')}` : q.name.replace('(OUT)','');
    if (q.y===0) s+=`<text class="pilab out ${PIN_CLS[q.role]}" transform="translate(${cx+3} -16) rotate(-90)">${lab}</text>`;
    else s+=`<text class="pilab out ${PIN_CLS[q.role]}" text-anchor="end" transform="translate(${cx+3} 156) rotate(-90)">${lab}</text>`;
  }
  s+=`<text class="pinno" x="-22" y="144" text-anchor="end">1</text><text class="pinno" x="-22" y="4" text-anchor="end">40</text><text class="pinno" x="396" y="144">20</text><text class="pinno" x="396" y="4">21</text>`;
  return s;
}

/* ===================== ブレッドボード ===================== */
const BB_CACHE = {};
function bbLayout(cols){
  if (BB_CACHE[cols]) return BB_CACHE[cols];
  const holes = [];
  for (let x=0;x<cols;x++){
    for (let r=0;r<5;r++) holes.push({x, y:3+r, strip:'T'+x, name:`${x+1}${'abcde'[r]}`, desc:`${x+1}列の a〜e とつながっています`});
    for (let r=0;r<5;r++) holes.push({x, y:10+r, strip:'B'+x, name:`${x+1}${'fghij'[r]}`, desc:`${x+1}列の f〜j とつながっています`});
  }
  const groups = cols>=60?10:5;
  for (let g=0;g<groups;g++) for (let i=0;i<5;i++){
    const x = 1+g*6+i;
    holes.push({x,y:0,strip:'RT-',name:`上の−ライン（${x+1}列あたり）`,desc:'上の−ライン：横一列すべてつながっています'});
    holes.push({x,y:1,strip:'RT+',name:`上の＋ライン（${x+1}列あたり）`,desc:'上の＋ライン：横一列すべてつながっています'});
    holes.push({x,y:16,strip:'RB+',name:`下の＋ライン（${x+1}列あたり）`,desc:'下の＋ライン：横一列すべてつながっています'});
    holes.push({x,y:17,strip:'RB-',name:`下の−ライン（${x+1}列あたり）`,desc:'下の−ライン：横一列すべてつながっています'});
  }
  return BB_CACHE[cols] = holes;
}
function bbDraw(cols){
  const W=(cols-1)*P;
  let s = `<rect x="-30" y="-30" width="${W+60}" height="400" rx="10" fill="#f5f4f0" stroke="#cbc8bd" stroke-width="1.5"/>`;
  s += `<rect x="-30" y="160" width="${W+60}" height="20" fill="#e2dfd6"/>`;
  s += `<line x1="-30" y1="45" x2="${W+30}" y2="45" stroke="#e2dfd6" stroke-width="2"/><line x1="-30" y1="295" x2="${W+30}" y2="295" stroke="#e2dfd6" stroke-width="2"/>`;
  s += `<line x1="0" y1="-12" x2="${W}" y2="-12" stroke="#2f62c9" stroke-width="2"/><line x1="0" y1="32" x2="${W}" y2="32" stroke="#d0312d" stroke-width="2"/>`;
  s += `<line x1="0" y1="308" x2="${W}" y2="308" stroke="#d0312d" stroke-width="2"/><line x1="0" y1="352" x2="${W}" y2="352" stroke="#2f62c9" stroke-width="2"/>`;
  for (const xx of [-17, W+17]){
    s += `<text class="bbsym" x="${xx}" y="5" text-anchor="middle" fill="#2f62c9">−</text><text class="bbsym" x="${xx}" y="25" text-anchor="middle" fill="#d0312d">+</text>`;
    s += `<text class="bbsym" x="${xx}" y="325" text-anchor="middle" fill="#d0312d">+</text><text class="bbsym" x="${xx}" y="345" text-anchor="middle" fill="#2f62c9">−</text>`;
  }
  for (let c=1;c<=cols;c++) if (c===1||c%5===0){
    s += `<text class="bbtxt" x="${(c-1)*P}" y="50" text-anchor="middle">${c}</text><text class="bbtxt" x="${(c-1)*P}" y="298" text-anchor="middle">${c}</text>`;
  }
  'abcde'.split('').forEach((l,i)=>{ s+=`<text class="bbtxt" x="-17" y="${(3+i)*P+3}" text-anchor="middle">${l}</text><text class="bbtxt" x="${W+17}" y="${(3+i)*P+3}" text-anchor="middle">${l}</text>`; });
  'fghij'.split('').forEach((l,i)=>{ s+=`<text class="bbtxt" x="-17" y="${(10+i)*P+3}" text-anchor="middle">${l}</text><text class="bbtxt" x="${W+17}" y="${(10+i)*P+3}" text-anchor="middle">${l}</text>`; });
  let d='';
  for (const h of bbLayout(cols)) d += `M${h.x*P-4} ${h.y*P-4}h8v8h-8z`;
  s += `<path d="${d}" fill="#34332f"/>`;
  return s;
}

/* ===================== ラズパイ本体 ===================== */
function piDraw(){
  let s = `<rect x="-64" y="-18" width="669" height="441" rx="22" fill="#1f7a46" stroke="#135a31" stroke-width="2"/>`;
  for (const [hx,hy] of [[-36,10],[421,10],[-36,396],[421,396]]) s += `<circle cx="${hx}" cy="${hy}" r="13" fill="#d4b553"/><circle cx="${hx}" cy="${hy}" r="7.5" fill="#0d3a22"/>`;
  s += `<rect x="512" y="30" width="118" height="100" rx="4" fill="#c4c9cd" stroke="#8a9096"/><rect x="512" y="150" width="118" height="100" rx="4" fill="#c4c9cd" stroke="#8a9096"/><rect x="505" y="272" width="125" height="122" rx="4" fill="#c4c9cd" stroke="#8a9096"/>`;
  s += `<rect x="530" y="50" width="88" height="22" fill="#1e5fd0"/><rect x="530" y="88" width="88" height="22" fill="#1e5fd0"/><rect x="530" y="170" width="88" height="22" fill="#2b2b2b"/><rect x="530" y="208" width="88" height="22" fill="#2b2b2b"/>`;
  s += `<rect x="190" y="150" width="120" height="120" rx="6" fill="#b9bec3" stroke="#7f868c"/><rect x="330" y="170" width="70" height="80" rx="3" fill="#1d1d1d"/>`;
  s += `<rect x="20" y="398" width="58" height="34" rx="4" fill="#bfc4c8"/><rect x="110" y="402" width="48" height="30" rx="3" fill="#bfc4c8"/><rect x="190" y="402" width="48" height="30" rx="3" fill="#bfc4c8"/>`;
  s += `<text x="20" y="330" fill="#eaf6ef" style="font:700 30px var(--ui)">Raspberry Pi</text><text x="22" y="358" fill="#b7dcc6" style="font:500 14px var(--mono)">40ピン GPIO（Pi 4 / Pi 5）</text>`;
  s += `<rect x="-14" y="-12" width="408" height="44" rx="3" fill="#161616"/>`;
  for (const q of PI_PINS){
    const cx=q.x*P, cy=q.y*P;
    s += `<circle cx="${cx}" cy="${cy}" r="7" fill="none" stroke="${PIN_COL[q.role]}" stroke-width="2.6"/><rect x="${cx-3.5}" y="${cy-3.5}" width="7" height="7" fill="#e0bf55"/>`;
    const lab = q.role==='gpio' ? (q.alt && [2,3].includes(q.gpio) ? `G${q.gpio} ${q.alt}` : 'GPIO'+q.gpio) : q.name;
    if (q.y===0) s += `<text class="pilab out ${PIN_CLS[q.role]}" transform="translate(${cx+3} -16) rotate(-90)">${lab}</text>`;
    else s += `<text class="pilab in ${PIN_CLS[q.role]}" text-anchor="end" transform="translate(${cx+3} 38) rotate(-90)">${lab}</text>`;
  }
  s += `<text class="pinno" x="-22" y="24" text-anchor="end">1</text><text class="pinno" x="-22" y="4" text-anchor="end">2</text><text class="pinno" x="396" y="24">39</text><text class="pinno" x="396" y="4">40</text>`;
  return s;
}

/* ===================== 部品 ===================== */
const LED_COLORS = {red:{l:'赤',c:'#e53935'},green:{l:'緑',c:'#43a047'},yellow:{l:'黄',c:'#fdd835'},blue:{l:'青',c:'#1e88e5'},white:{l:'白',c:'#f1f1ee'}};
const R_VALUES = [100,220,330,470,1000,2200,4700,10000];
const BAND = ['#1a1a1a','#7a4a1e','#d0312d','#ef7d1a','#f2d11a','#2e8b3e','#2f62c9','#7b3fb5','#8a8a8a','#f4f4f4'];
const fmtOhm = v => v>=1000 ? (v/1000)+'kΩ' : v+'Ω';
function bands(v){ const s=String(v); return [ +s[0], +s[1], s.length-2 ]; }

function headerSVG(names, tag){
  const w=(names.length-1)*P; let s='';
  if (tag) s += `<rect x="-10" y="-27" width="${w+20}" height="17" rx="3" fill="#2a2a2a"/>`;
  s += `<rect x="-9" y="-8" width="${w+18}" height="16" rx="2" fill="#151515"/>`;
  names.forEach((nm,i)=>{ s += `<rect x="${i*P-3.5}" y="-3.5" width="7" height="7" fill="#d9b54a"/><text x="${i*P}" y="-15" class="slk" text-anchor="middle">${esc(nm)}</text>`; });
  return s;
}
function modType(o){
  return Object.assign({
    pins: () => o.pinDefs.map((p,i)=>({x:i,y:0,name:p[0],role:p[1],label:p[2]||p[0]})),
    bbox: () => o.box,
    draw: () => {
      let s='';
      if (o.pcb){ const [x0,y0,x1] = o.box; s += `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${-6-y0}" rx="6" fill="${o.pcb}" stroke="rgba(0,0,0,.35)"/>`; }
      s += o.art();
      s += headerSVG(o.pinDefs.map(p=>p[0]), !o.pcb);
      return s;
    }
  }, o);
}

const TYPES = {
  pi: { name:'Raspberry Pi', sub:'40ピンGPIO・Pi 4/5', cat:'board', board:true, mcu:true, chip:'#1f7a46', icon:'Pi',
    pins: () => PI_PINS, bbox: () => [-64,-75,605,423], draw: piDraw },
  pico: { name:'Raspberry Pi Pico W', sub:'MicroPython・ブレッドボードにさせる', cat:'board', mcu:true, chip:'#1e7d3c', icon:'Pico',
    pins: () => PICO_PINS, bbox: () => [-46,-62,404,206], draw: picoDraw },
  bb830: { name:'ブレッドボード', sub:'フルサイズ 830穴', cat:'board', board:true, bb:true, cols:63, chip:'#cfcbbf', icon:'830',
    pins: () => [], bbox: () => [-30,-30,62*P+30,370], draw: () => bbDraw(63) },
  bb400: { name:'ブレッドボード（ハーフ）', sub:'400穴', cat:'board', board:true, bb:true, cols:30, chip:'#cfcbbf', icon:'400',
    pins: () => [], bbox: () => [-30,-30,29*P+30,370], draw: () => bbDraw(30) },

  resistor: { name:'抵抗', sub:'カラーコードつき', cat:'basic', chip:'#c9a76b', icon:'R',
    props:[{k:'ohm',l:'抵抗値',opts:R_VALUES.map(v=>({v,l:fmtOhm(v)}))}], defaults:{ohm:220},
    pins: () => [{x:0,y:0,name:'端子1',role:'r',label:'片方の足'},{x:4,y:0,name:'端子2',role:'r',label:'もう片方の足'}],
    bbox: () => [-4,-10,84,10],
    draw: (pr) => {
      const b = bands(pr.ohm);
      let s = `<line x1="0" y1="0" x2="80" y2="0" stroke="#9aa0a6" stroke-width="2.6"/>`;
      s += `<path d="M18 -6.5 Q16 -8 22 -8 L58 -8 Q64 -8 62 -6.5 L62 6.5 Q64 8 58 8 L22 8 Q16 8 18 6.5 Z" fill="#e3c896" stroke="#b39a68"/>`;
      s += `<rect x="24" y="-8" width="4" height="16" fill="${BAND[b[0]]}"/><rect x="32" y="-8" width="4" height="16" fill="${BAND[b[1]]}"/><rect x="40" y="-8" width="4" height="16" fill="${BAND[b[2]]}"/><rect x="53" y="-8" width="4" height="16" fill="#c9a227"/>`;
      return s;
    } },
  led: { name:'LED', sub:'発光ダイオード', cat:'basic', chip:'#e53935', icon:'LED',
    props:[{k:'color',l:'色',opts:Object.entries(LED_COLORS).map(([v,o])=>({v,l:o.l}))}], defaults:{color:'red'},
    pins: () => [{x:0,y:0,name:'＋',role:'a',label:'長い足（＋・アノード）'},{x:1,y:0,name:'−',role:'k',label:'短い足（−・カソード）'}],
    bbox: () => [-12,-56,30,6],
    draw: (pr) => {
      const c = LED_COLORS[pr.color]?.c || '#e53935';
      let s = `<path d="M0 0 L0 -9 L5 -15 L5 -24" fill="none" stroke="#9aa0a6" stroke-width="2.4"/><path d="M20 0 L20 -24" fill="none" stroke="#9aa0a6" stroke-width="2.4"/>`;
      s += `<path d="M-2 -24 L-2 -42 A12 12 0 0 1 22 -42 L22 -24 Z" fill="${c}" fill-opacity=".9" stroke="rgba(0,0,0,.35)"/>`;
      s += `<path d="M-5 -27 L23 -27 L23 -22 L-5 -22 Z" fill="${c}" stroke="rgba(0,0,0,.35)"/>`;
      s += `<ellipse cx="4" cy="-40" rx="3" ry="6" fill="#fff" opacity=".5"/>`;
      s += `<text class="tagtxt" x="-9" y="-3" text-anchor="middle">+</text>`;
      return s;
    } },
  button: { name:'タクトスイッチ', sub:'押しボタン', cat:'basic', chip:'#333', icon:'SW',
    links: [[0,2],[1,3]],
    pins: () => [{x:0,y:0,name:'端子1',role:'sw',label:'左上の足'},{x:2,y:0,name:'端子2',role:'sw',label:'右上の足'},{x:0,y:3,name:'端子3',role:'sw',label:'左下の足'},{x:2,y:3,name:'端子4',role:'sw',label:'右下の足'}],
    bbox: () => [-6,-4,46,64],
    draw: () => {
      let s = '';
      for (const [x,y,x2,y2] of [[0,0,3,8],[40,0,37,8],[0,60,3,52],[40,60,37,52]]) s += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#9aa0a6" stroke-width="3"/>`;
      s += `<rect x="-4" y="6" width="48" height="48" rx="4" fill="#2b2b2b" stroke="#111"/><circle cx="20" cy="30" r="14" fill="#141414" stroke="#555" stroke-width="2"/>`;
      s += `<line x1="2" y1="12" x2="2" y2="48" stroke="#7fb4ff" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="38" y1="12" x2="38" y2="48" stroke="#7fb4ff" stroke-width="1.6" stroke-dasharray="3 3"/>`;
      return s;
    } },

const isMCU = p => !!(p && TYPES[p.type].mcu);
const mcuPart = () => S.parts.find(isMCU);
const isPicoCircuit = () => mcuPart()?.type==='pico';
const GN = n => (isPicoCircuit()?'GP':'GPIO')+n;
const mcuLabel = p => p.type==='pico'?'Pico':'ラズパイ';
const I2C_SDA = {pi:[2], pico:[0,4,8,12,16,20,2,6,10,14,18,26]};
const I2C_SCL = {pi:[3], pico:[1,5,9,13,17,21,3,7,11,15,19,27]};
function dispName(p){
  if (p.type==='led') return `LED（${LED_COLORS[p.props.color]?.l||'赤'}）`;
  if (p.type==='resistor') return `抵抗（${fmtOhm(p.props.ohm)}）`;
  return TYPES[p.type].name;
}
function pinsOf(p){
  const T=TYPES[p.type];
  return T.pins(p.props).map(q=>{ const [dx,dy]=rotXY(q.x,q.y,p.rot); return Object.assign({},q,{gx:p.x+dx,gy:p.y+dy}); });
}

/* ===================== 状態 ===================== */
let S = {title:'', parts:[], wires:[], order:[], code:''};
let nid = 1;
let sel = null;            // {kind:'part'|'wire', id}
let M = null;              // 解析結果
let view = {s:1, tx:0, ty:0};
let wireColor = '#1e63d6';
let stepMode = null;       // {i}

let hover = null;          // {key, root}
let flashIds = new Set();
let showLabels = true;
let tab = 'insp';
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

function addPart(type, x, y, props, rot){
  const T=TYPES[type];
  const p={id:'p'+(nid++), type, x, y, rot:rot||0, props:Object.assign({}, T.defaults||{}, props||{}), note:''};
  S.parts.push(p); if(!T.board) S.order.push(p.id); return p;
}
function addWire(a, b, color, note){
  const w={id:'w'+(nid++), a:[a[0],a[1]], b:[b[0],b[1]], color, note:note||''};
  S.wires.push(w); S.order.push(w.id); return w;
}
const getPart = id => S.parts.find(p=>p.id===id);
const getWire = id => S.wires.find(w=>w.id===id);

/* ===================== 解析（つながり） ===================== */
class UF{ constructor(){this.p=new Map();} find(a){ let p=this.p; if(!p.has(a)){p.set(a,a);return a;} let r=a; while(p.get(r)!==r) r=p.get(r); while(p.get(a)!==r){const n=p.get(a);p.set(a,r);a=n;} return r; } union(a,b){ const ra=this.find(a), rb=this.find(b); if(ra!==rb) this.p.set(ra,rb); } }
function analyze(){
  const uf=new UF(), pts=new Map();
  const gp=(x,y)=>{ const k=K(x,y); let o=pts.get(k); if(!o){ o={x,y,key:k,holes:[],pins:[],ends:[]}; pts.set(k,o);} return o; };
  const partById=new Map(S.parts.map(p=>[p.id,p]));
  for (const p of S.parts){
    const T=TYPES[p.type];
    if (T.bb){
      bbLayout(T.cols).forEach((h,i)=>{ const [dx,dy]=rotXY(h.x,h.y,p.rot); const x=p.x+dx, y=p.y+dy;
        gp(x,y).holes.push({part:p.id,i}); const hk='h:'+p.id+':'+i; uf.union(hk,'s:'+p.id+':'+h.strip); uf.union(hk,'p:'+K(x,y)); });
      continue;
    }
    pinsOf(p).forEach((q,i)=>{ gp(q.gx,q.gy).pins.push({part:p.id,i}); const tk='t:'+p.id+':'+i; uf.union(tk,'p:'+K(q.gx,q.gy));
      if (T.mcu && (q.role==='3v3'||q.role==='5v'||q.role==='gnd')) uf.union(tk,'pw:'+p.id+':'+q.role); });
    if (T.links) for (const [a,b] of T.links) uf.union('t:'+p.id+':'+a,'t:'+p.id+':'+b);
  }
  for (const w of S.wires){ gp(w.a[0],w.a[1]).ends.push({w:w.id,e:'a'}); gp(w.b[0],w.b[1]).ends.push({w:w.id,e:'b'}); uf.union('p:'+K(w.a[0],w.a[1]),'p:'+K(w.b[0],w.b[1])); }
  const nets=new Map();
  for (const p of S.parts){ if (TYPES[p.type].bb) continue;
    pinsOf(p).forEach((q,i)=>{ const r=uf.find('t:'+p.id+':'+i); let n=nets.get(r); if(!n){n={root:r,terms:[]};nets.set(r,n);} n.terms.push({part:p,i,pin:q}); }); }
  const rootPts=new Map();
  for (const [k,o] of pts){ const r=uf.find('p:'+k); o.root=r; if(!rootPts.has(r)) rootPts.set(r,[]); rootPts.get(r).push(o); }
  M={uf,pts,nets,rootPts,partById};
}
const rootT = (p,i) => M.uf.find('t:'+p.id+':'+i);
function kinds(root){
  const n=M.nets.get(root); const k={v33:false,v5:false,gnd:false,gpios:[],terms:n?n.terms:[]};
  for (const t of k.terms){ if (!isMCU(t.part)) continue; const r=t.pin.role; k.mcu=t.part.type;
    if(r==='3v3')k.v33=true; else if(r==='5v')k.v5=true; else if(r==='gnd')k.gnd=true; else if(r==='gpio'&&!k.gpios.includes(t.pin.gpio)) k.gpios.push(t.pin.gpio); }
  return k;
}
function viaR(root){ // 抵抗の反対側のネット
  const out=[]; const n=M.nets.get(root); if(!n) return out;
  for (const t of n.terms) if (t.part.type==='resistor'){ const o=rootT(t.part,1-t.i); if(o!==root) out.push(o); }
  return out;
}
const isSrc = k => k.v33||k.v5||k.gpios.length>0;
function srcName(k){ return k.gpios.length?GN(k.gpios[0]):k.v5?'5V':k.v33?'3.3V':''; }

/* ===================== 配線チェック ===================== */
function runChecks(){
  const out=[]; const seen=new Set();
  const push=(lv,msg,ids)=>{ if(seen.has(msg)) return; seen.add(msg); out.push({lv,msg,ids:ids||[]}); };
  const comps=S.parts.filter(p=>!TYPES[p.type].board&&!isMCU(p));
  const pis=S.parts.filter(isMCU);
  if (!S.parts.length){ push('info','部品がありません。左の一覧からラズパイとブレッドボードを置きましょう'); return out; }
  if (!pis.length && comps.length) push('info','ラズパイ（またはPico）が置かれていません');

  // 電源まわり（ネット単位）
  for (const [root,n] of M.nets){
    const k=kinds(root); const ids=[...new Set(k.terms.map(t=>t.part.id))];
    if ((k.v33||k.v5)&&k.gnd) push('error',`ショート：${k.v5?'5V':'3.3V'}とGNDが直接つながっています。ラズパイが壊れるおそれがあります`,ids);
    if (k.v33&&k.v5) push('error','3.3Vと5Vが直接つながっています',ids);
    if (k.v5&&k.gpios.length) push('error',`${k.gpios.map(GN).join('・')}に5Vがつながっています。GPIOは3.3Vまでです`,ids);
    if (k.gpios.length&&(k.gnd||k.v33)&&!k.v5) push('warn',`${GN(k.gpios[0])}が${k.gnd?'GND':'3.3V'}に直結しています。出力にするとショートします`,ids);
    if (k.gpios.length>1) push('warn',`${k.gpios.map(GN).join('と')}が同じところにつながっています`,ids);
  }
  // 部品ごと
  for (const p of comps){
    const T=TYPES[p.type]; const pins=pinsOf(p); const nm=dispName(p);
    const before=out.length;
    // 端子どうしが同じネット
    if (p.type!=='button'){
      const byRoot=new Map(); pins.forEach((q,i)=>{ const r=rootT(p,i); if(!byRoot.has(r)) byRoot.set(r,[]); byRoot.get(r).push(q); });
      for (const qs of byRoot.values()) if (qs.length>1){
        const names=qs.map(q=>q.name).join('と');
        push(p.type==='resistor'?'warn':'error', `${nm}：${names}が同じ列（同じつながり）にささっています。部品を通らずに電気が流れてしまいます`, [p.id]);
      }
    }
    if (p.type==='led'){
      const a=rootT(p,0), c=rootT(p,1);
      if (a!==c){
        const A=kinds(a), C=kinds(c), aR=viaR(a).map(kinds), cR=viaR(c).map(kinds);
        const aS=isSrc(A), aSR=aR.some(isSrc), aG=A.gnd, aGR=aR.some(k=>k.gnd);
        const cS=isSrc(C), cSR=cR.some(isSrc), cG=C.gnd, cGR=cR.some(k=>k.gnd);
        if (aS&&cG) push('error',`${nm}：抵抗がありません。電流が流れすぎてLEDやラズパイを傷めます。LEDと直列に抵抗（220Ωなど）を入れましょう`,[p.id]);
        else if ((aS||aSR)&&(cG||cGR)) push('ok',`${nm}：${srcName(aS?A:aR.find(isSrc))} → ${aS?'LED → 抵抗':'抵抗 → LED'} → GND。正しい向きです`,[p.id]);
        else if ((aG||aGR)&&(cS||cSR)) push('warn',`${nm}：向きが逆です。長い足（＋）を${srcName(cS?C:cR.find(isSrc))}側、短い足（−）をGND側にします`,[p.id]);
        else if (A.terms.length<=1||C.terms.length<=1) push('info',`${nm}：${A.terms.length<=1?'長い足（＋）':'短い足（−）'}がどこにもつながっていません`,[p.id]);
        else push('warn',`${nm}：GPIO（または電源）からGNDまでの道すじができていません`,[p.id]);
      }
    } else if (p.type==='buzzer'){
      const a=rootT(p,0), c=rootT(p,1);
      if (a!==c){ const A=kinds(a), C=kinds(c);
        if (isSrc(A)&&C.gnd) push('ok',`${nm}：${srcName(A)}とGNDにつながっています`,[p.id]);
        else if (A.gnd&&isSrc(C)) push('warn',`${nm}：＋と−が逆です`,[p.id]);
        else push('info',`${nm}：＋をGPIO、−をGNDにつなぎましょう`,[p.id]); }
    } else if (p.type==='button'){
      const s0=rootT(p,0), s1=rootT(p,1);
      if (s0===s1) push('warn',`${nm}：押さなくても常につながっています。スイッチを90°回転させて、中央の溝をまたぐようにさしましょう`,[p.id]);
      else { const A=kinds(s0), B=kinds(s1);
        const g = A.gpios.length?A:B.gpios.length?B:null, o = g===A?B:A;
        if (!g) push('info',`${nm}：GPIOにつながっていません`,[p.id]);
        else if (o.v5) push('error',`${nm}：押すとGPIOに5Vがかかります。3.3VかGNDを使いましょう`,[p.id]);
        else if (o.gnd) push('ok',`${nm}：${GN(g.gpios[0])} と GND の間。押すとLOWになります（プログラムでプルアップを有効に）`,[p.id]);
        else if (o.v33) push('ok',`${nm}：${GN(g.gpios[0])} と 3.3V の間。押すとHIGHになります（プログラムでプルダウンを有効に）`,[p.id]);
        else push('info',`${nm}：もう一方の足をGNDか3.3Vにつなぎましょう`,[p.id]); }
    } else if (p.type==='resistor'){
      pins.forEach((q,i)=>{ if (kinds(rootT(p,i)).terms.length<=1) push('info',`${nm}：${q.label}がどこにもつながっていません`,[p.id]); });
    } else if (T.pinDefs){
      checkModule(p, push);
      if (out.length===before) push('ok',`${nm}：配線OK`,[p.id]);
    }
  }
  // 浮いているジャンパ線の端
  for (const o of M.pts.values()) if (o.ends.length===1 && !o.holes.length && !o.pins.length){
    const w=getWire(o.ends[0].w); push('warn',`${colorName(w.color)}のジャンパ線：片方の端がどこにもささっていません`,[w.id]);
  }
  const ord={error:0,warn:1,info:2,ok:3};
  out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
  return out;
}
function checkModule(p, push){
  const pins=pinsOf(p); const nm=dispName(p);
  const vi=pins.findIndex(q=>q.role==='vcc'||q.role==='vcc5');
  const VK=vi>=0?kinds(rootT(p,vi)):null;
  const ids=[p.id];
  pins.forEach((q,i)=>{
    const r=rootT(p,i), k=kinds(r), lone=k.terms.length<=1;
    switch(q.role){
      case 'vcc': if(!(k.v33||k.v5)) push('warn', lone?`${nm}：VCCがつながっていません（3.3Vへ）`:`${nm}：VCCが電源（3.3V/5V）につながっていません`, ids); break;
      case 'vcc5': if(k.v5){} else if(k.v33) push('warn',`${nm}：VCCは5Vが必要です（今は3.3V）`,ids); else push('warn',`${nm}：VCC（5V）がつながっていません`,ids); break;
      case 'gnd': if(!k.gnd) push('warn',`${nm}：GNDがつながっていません`,ids); break;
      case 'dout': if(!k.gpios.length) push('warn',`${nm}：${q.name}をGPIOにつなぎましょう`,ids);
        else if(VK&&VK.v5) push('error',`${nm}：5Vで給電しているので${q.name}から5Vが出ます。VCCは3.3Vにしましょう`,ids); break;
      case 'din': if(!k.gpios.length) push('warn',`${nm}：${q.name}をGPIOにつなぎましょう`,ids); break;
      case 'echo':
        if (k.gpios.length && VK && VK.v5) push('error',`${nm}：Echoは5Vを出します。GPIOに直結せず、抵抗で分圧（例：1kΩと2kΩ）しましょう`,ids);
        else if (!k.gpios.length){ if (viaR(r).some(x=>kinds(x).gpios.length)) push('info',`${nm}：Echoは抵抗を通してGPIOへ。分圧になっているか確認しましょう`,ids); else push('warn',`${nm}：EchoをGPIOにつなぎましょう`,ids); }
        break;
      case 'aout':
        if (k.mcu==='pico' || (!k.mcu && isPicoCircuit())){ if(k.gpios.some(g=>g>=26&&g<=28)) {} else if(k.gpios.length) push('warn',`${nm}：アナログ値はGP26〜GP28（ADC0〜2）でしか読めません`,ids); else push('warn',`${nm}：AOUTをGP26〜GP28（ADC）につなぎましょう`,ids); }
        else if(k.gpios.length) push('warn',`${nm}：AOUTはアナログ信号です。ラズパイのGPIOでは読めないので、ADC（MCP3008など）を通します`,ids);
        else push('info',`${nm}：AOUTはADC（MCP3008など）を通して読み取ります。Pico WならGP26〜28に直接つなげます`,ids); break;
      case 'sda': case 'scl': {
        if (isPicoCircuit()){
          const okSet=q.role==='sda'?I2C_SDA.pico:I2C_SCL.pico, otherSet=q.role==='sda'?I2C_SCL.pico:I2C_SDA.pico;
          if (k.gpios.some(g=>okSet.includes(g))) {}
          else if (k.gpios.some(g=>otherSet.includes(g))) push('error',`${nm}：SDAとSCLが逆です`,ids);
          else if (k.gpios.length) push('error',`${nm}：GP${k.gpios[0]}は${q.name}に使えません（例：SDA=GP0・SCL=GP1、SDA=GP4・SCL=GP5）`,ids);
          else push('warn',`${nm}：${q.name}がつながっていません`,ids);
          break;
        }
        const want=q.role==='sda'?2:3, other=q.role==='sda'?3:2, no=want===2?3:5;
        if (k.gpios.includes(want)) {}
        else if (k.gpios.includes(other)) push('error',`${nm}：SDAとSCLが逆です`,ids);
        else if (k.gpios.length) push('error',`${nm}：${q.name}はGPIO${want}（${no}番ピン）につなぎます`,ids);
        else push('warn',`${nm}：${q.name}がつながっていません（GPIO${want}・${no}番ピンへ）`,ids);
        break; }
      case 'onewire':
        if (!k.gpios.length) push('warn',`${nm}：DATAをGPIOにつなぎましょう（ふつうはGPIO4・7番ピン）`,ids);
        else { if(!isPicoCircuit()&&!k.gpios.includes(4)) push('info',`${nm}：1-Wireの初期設定はGPIO4です。GPIO${k.gpios[0]}を使うときは設定を変えます`,ids);
          if(!viaR(r).some(x=>kinds(x).v33)) push('warn',`${nm}：DATAと3.3Vの間に4.7kΩのプルアップ抵抗が必要です`,ids); }
        break;
      case 'pwm':
        if (!k.gpios.length) push('warn',`${nm}：信号線をGPIOにつなぎましょう`,ids);
        else if (!isPicoCircuit()&&![12,13,18,19].includes(k.gpios[0])) push('info',`${nm}：GPIO${k.gpios[0]}だとソフトウェアPWMになり、ぶれることがあります。GPIO18（12番ピン）がおすすめです`,ids);
        break;
    }
  });
  if (p.type==='servo' && VK && VK.v5) push('info',`${nm}：動きが不安定なときは、サーボ用に別の5V電源を使います（GNDは共通に）`,ids);
  if (p.type==='lcd' && VK && VK.v5) push('info',`${nm}：5V給電のI2C液晶は、SDA/SCLが5Vに引き上げられる製品があります。心配ならレベル変換を使います`,ids);
}

/* ===================== お手本と比べる ===================== */
function netSignatures(){
  const sigs=[];
  for (const [root,n] of M.nets){
    const piL=new Set(), cl=[];
    for (const t of n.terms){
      if (isMCU(t.part)){ if(t.pin.role!=='nc') piL.add(t.pin.role==='gpio'?(t.part.type==='pico'?'GP':'GPIO')+t.pin.gpio:t.pin.role==='3v3'?'3.3V':t.pin.role==='5v'?'5V':'GND'); }
      else if (t.part.type==='resistor') cl.push(dispName(t.part)+'の足');
      else if (t.part.type==='button') cl.push('スイッチの足');
      else cl.push(dispName(t.part)+'の'+t.pin.name);
    }
    const labels=[...piL].sort().concat(cl.sort());
    if (labels.length>=2) sigs.push(labels);
  }
  return sigs;
}
function withState(st, fn){
  const saveS=S, saveM=M; S=st; analyze(); const r=fn(); S=saveS; M=saveM; return r;
}
function compareAnswer(){
  const mine=netSignatures();
  const ans=withState(deserialize(answer), netSignatures);
  const key=l=>l.join(' / ');
  const pool=new Map(); for (const l of mine){ const k=key(l); pool.set(k,(pool.get(k)||0)+1); }
  const missing=[]; let match=0;
  for (const l of ans){ const k=key(l); if (pool.get(k)>0){ pool.set(k,pool.get(k)-1); match++; } else missing.push(l); }
  const extra=[]; for (const l of mine){ const k=key(l); if (pool.get(k)>0){ pool.set(k,pool.get(k)-1); extra.push(l); } }
  // 近いもの同士を対応づける
  const pairs=[]; const ex=extra.slice();
  for (const m of missing){
    let best=-1, bi=-1; ex.forEach((e,i)=>{ const s=m.filter(x=>e.includes(x)).length; if(s>best){best=s;bi=i;} });
    if (bi>=0 && best>0){ pairs.push([m,ex[bi]]); ex.splice(bi,1); } else pairs.push([m,null]);
  }
  for (const e of ex) pairs.push([null,e]);
  return {total:ans.length, match, pairs};
}

/* ===================== 場所の名前・手順 ===================== */
function locName(o, exclPart){
  if (!o) return '（どこにもささっていない）';
  if (o.holes.length){
    const h=o.holes[0], p=M.partById.get(h.part); const L=bbLayout(TYPES[p.type].cols)[h.i];
    const bbs=S.parts.filter(q=>TYPES[q.type].bb);
    return (bbs.length>1?`ブレッドボード${bbs.indexOf(p)+1}の`:'') + L.name;
  }
  const pin=o.pins.find(q=>q.part!==exclPart);
  if (pin){ const p=M.partById.get(pin.part), q=pinsOf(p)[pin.i];
    if (isMCU(p)) return `${mcuLabel(p)} ${q.num}番ピン（${q.name}${q.alt?'・'+q.alt:''}）`;
    return `${dispName(p)}の${q.name}`; }
  return '（どこにもささっていない）';
}
function stepText(id){
  const p=getPart(id);
  if (p){
    const pins=pinsOf(p); const locs=pins.map(q=>M.pts.get(K(q.gx,q.gy)));
    const inserted=locs.filter(o=>o&&o.holes.length).length;
    if (!inserted) return `${dispName(p)}を用意する（ジャンパ線で直接つなぐ）`;
    if (p.type==='resistor') return `${dispName(p)}を ${locs.map(o=>locName(o,p.id)).join(' と ')} にさす`;
    if (p.type==='button') return `${dispName(p)}を ${locs.map(o=>locName(o,p.id)).join('・')} にさす`;
    return `${dispName(p)}の ` + pins.map((q,i)=>`${q.label}を ${locName(locs[i],p.id)}`).join('、') + ' にさす';
  }
  const w=getWire(id); if (!w) return '';
  let A=M.pts.get(K(w.a[0],w.a[1])), B=M.pts.get(K(w.b[0],w.b[1]));
  const isPi=o=>o&&o.pins.some(q=>isMCU(M.partById.get(q.part)));
  if (isPi(B)&&!isPi(A)) [A,B]=[B,A];
  return `${colorName(w.color)}のジャンパ線で ${locName(A)} と ${locName(B)} をつなぐ`;
}

/* ===================== 保存形式 ===================== */
function serialize(st){
  st=st||S;
  return {v:1, t:st.title,
    p:st.parts.map(p=>[p.id,p.type,p.x,p.y,p.rot,p.props,p.note||'']),
    w:st.wires.map(w=>[w.id,w.a,w.b,w.color,w.note||'']),
    o:st.order, c:st.code||''};
}
function deserialize(o){
  return {title:o.t||'',
    parts:(o.p||[]).filter(a=>TYPES[a[1]]).map(a=>({id:a[0],type:a[1],x:a[2],y:a[3],rot:a[4]||0,props:Object.assign({},TYPES[a[1]].defaults||{},a[5]||{}),note:a[6]||''})),
    wires:(o.w||[]).map(a=>({id:a[0],a:a[1],b:a[2],color:a[3],note:a[4]||''})),
    order:(o.o||[]).slice(), code:o.c||''};
}
function toCode(obj){
  const j=JSON.stringify(obj);
  if (window.LZString) return 'HL1.'+LZString.compressToEncodedURIComponent(j);
  return 'HL0.'+btoa(unescape(encodeURIComponent(j)));
}
function fromCode(code){
  code=(code||'').trim().replace(/\s+/g,'');
  const m=code.match(/HL([01])\.([A-Za-z0-9+\/=$\-_]+)/);
  if (!m) throw new Error('コードの形がちがいます。HL1. ではじまる文字列をそのまま貼り付けてください');
  let j;
  if (m[1]==='1'){ if(!window.LZString) throw new Error('読み込みに必要な部品が読み込めませんでした'); j=LZString.decompressFromEncodedURIComponent(m[2]); }
  else j=decodeURIComponent(escape(atob(m[2])));
  if (!j) throw new Error('コードの一部が欠けているようです。最初から最後までコピーし直してください');
  const o=JSON.parse(j); if(!o||!o.p) throw new Error('回路のデータが見つかりません');
  return o;
}
function loadState(st){
  S=st; sel=null;
  nid = 1 + Math.max(0,...S.parts.map(p=>+p.id.slice(1)||0),...S.wires.map(w=>+w.id.slice(1)||0));
  const ids=new Set([...S.parts.filter(p=>!TYPES[p.type].board).map(p=>p.id),...S.wires.map(w=>w.id)]);
  S.order=S.order.filter(id=>ids.has(id)); for(const id of ids) if(!S.order.includes(id)) S.order.push(id);
}

let hist=[], fut=[], lastSnap='';
const snap = () => JSON.stringify(serialize());
function commit(){ const s=snap(); if (s===lastSnap){ afterChange(); return; } hist.push(lastSnap); if(hist.length>120) hist.shift(); fut=[]; lastSnap=s; afterChange(); }
function undo(){ if(!hist.length) return; fut.push(lastSnap); lastSnap=hist.pop(); loadState(deserialize(JSON.parse(lastSnap))); afterChange(); }
function redo(){ if(!fut.length) return; hist.push(lastSnap); lastSnap=fut.pop(); loadState(deserialize(JSON.parse(lastSnap))); afterChange(); }
function afterChange(){
  analyze(); renderAll(); renderSide();
  store.set('haisenlab.v1', lastSnap||snap());
  $('#bUndo').disabled=!hist.length; $('#bRedo').disabled=!fut.length;
}

/* ===================== 描画 ===================== */
const cv=$('#cv'), vp=$('#vp');
const partEls=new Map();
function applyView(){ vp.setAttribute('transform',`translate(${view.tx} ${view.ty}) scale(${view.s})`); }
function syncParts(){
  const seen=new Set();
  const st = stepMode ? stepClasses() : null;
  for (const p of S.parts){
    seen.add(p.id); const T=TYPES[p.type];
    let e=partEls.get(p.id);
    if (!e){ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.dataset.part=p.id; g.dataset.type=p.type; g.setAttribute('class','part');
      (T.board?$('#lyBoards'):$('#lyParts')).appendChild(g); e={g,sig:null}; partEls.set(p.id,e); }
    const sig=p.type+JSON.stringify(p.props);
    if (e.sig!==sig){
      let marks=''; if(!T.board) for (const q of T.pins(p.props)) marks+=`<circle class="pm" cx="${q.x*P}" cy="${q.y*P}" r="5"/>`;
      e.g.innerHTML=T.draw(p.props)+marks+'<g class="fx"></g>'; e.sig=sig; e.fx=e.g.lastElementChild; e.fxs=null;
    }
    const f=fxSVG(p); if (e.fxs!==f){ e.fx.innerHTML=f; e.fxs=f; }
    e.g.setAttribute('transform',`translate(${p.x*P} ${p.y*P}) rotate(${p.rot*90})`);
    const cls=['part']; if(sel&&sel.kind==='part'&&sel.id===p.id&&!stepMode) cls.push('sel'); if(flashIds.has(p.id)) cls.push('flash'); if(st&&st[p.id]) cls.push(st[p.id]);
    e.g.setAttribute('class',cls.join(' '));
  }
  for (const [id,e] of partEls) if(!seen.has(id)){ e.g.remove(); partEls.delete(id); }
}
function wirePath(a,b){
  const ax=a[0]*P, ay=a[1]*P, bx=b[0]*P, by=b[1]*P;
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
  let nx=-dy/len, ny=dx/len; if (ny>0||(ny===0&&nx>0)){ nx=-nx; ny=-ny; }
  const bow=Math.min(len*0.14,46);
  return `M${ax} ${ay} Q${(ax+bx)/2+nx*bow} ${(ay+by)/2+ny*bow} ${bx} ${by}`;
}
function renderWires(){
  const st = stepMode ? stepClasses() : null;
  const hlW = hover && M ? new Set((M.rootPts.get(hover.root)||[]).flatMap(o=>o.ends.map(e=>e.w))) : new Set();
  let s='';
  for (const w of S.wires){
    const d=wirePath(w.a,w.b);
    const cls=['wire']; if(sel&&sel.kind==='wire'&&sel.id===w.id&&!stepMode) cls.push('sel'); if(hlW.has(w.id)) cls.push('hlw'); if(flashIds.has(w.id)) cls.push('flash'); if(st&&st[w.id]) cls.push(st[w.id]);
    s+=`<g class="${cls.join(' ')}" data-wire="${w.id}"><path class="hit" d="${d}"/><path class="ol" d="${d}" stroke-width="8"/><path class="core" d="${d}" stroke="${w.color}" stroke-width="5"/><path class="shine" d="${d}" stroke-width="1.4"/>`;
    s+=`<circle class="wend" data-wend="${w.id}:a" cx="${w.a[0]*P}" cy="${w.a[1]*P}" r="5"/><circle class="wend" data-wend="${w.id}:b" cx="${w.b[0]*P}" cy="${w.b[1]*P}" r="5"/></g>`;
  }
  $('#lyWires').innerHTML=s;
}
let preview=null;
function drawOverlay(){
  let s='';
  if (hover && M && !drag){
    const list=M.rootPts.get(hover.root)||[];
    for (const o of list) if (o.holes.length||o.pins.length) s+=`<circle class="hlfill" cx="${o.x*P}" cy="${o.y*P}" r="8"/><circle class="hlring" cx="${o.x*P}" cy="${o.y*P}" r="8"/>`;
  }
  if (preview) s+=`<path class="preview" d="${wirePath(preview.a,preview.b)}" stroke="${preview.color}"/><circle class="hlring" cx="${preview.b[0]*P}" cy="${preview.b[1]*P}" r="8"/>`;
  $('#lyOver').innerHTML=s;
}
function renderAll(){ syncParts(); renderWires(); drawOverlay(); cv.classList.toggle('stepping',!!stepMode); cv.classList.toggle('running',!!run); cv.classList.toggle('nolabels',!showLabels); }
function renderLight(){ syncParts(); renderWires(); drawOverlay(); }

/* ===================== 表示範囲 ===================== */
function partBounds(p){
  const [x0,y0,x1,y1]=TYPES[p.type].bbox(p.props);
  const cs=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>rotXY(x,y,p.rot));
  return cs.map(([x,y])=>[x+p.x*P,y+p.y*P]);
}
function fitView(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  let pts=[]; for (const p of S.parts) pts=pts.concat(partBounds(p)); for (const w of S.wires) pts.push([w.a[0]*P,w.a[1]*P],[w.b[0]*P,w.b[1]*P]);
  if (!pts.length){ view={s:1,tx:r.width/2,ty:r.height/2}; applyView(); return; }
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs)-30, x1=Math.max(...xs)+30, y0=Math.min(...ys)-30, y1=Math.max(...ys)+30;
  const s=Math.min(2.2,Math.max(0.2,Math.min(r.width/(x1-x0), r.height/(y1-y0))));
  view={s, tx:(r.width-(x1-x0)*s)/2-x0*s, ty:(r.height-(y1-y0)*s)/2-y0*s};
  applyView();
}
function zoomAt(f, cx, cy){
  const ns=Math.min(4,Math.max(0.15,view.s*f)); const k=ns/view.s;
  view.tx=cx-(cx-view.tx)*k; view.ty=cy-(cy-view.ty)*k; view.s=ns; applyView();
}
function toWorld(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-view.tx)/view.s, y:(e.clientY-r.top-view.ty)/view.s}; }
function gridOf(w){ const gx=Math.round(w.x/P), gy=Math.round(w.y/P); return {gx,gy,d:Math.hypot(w.x-gx*P,w.y-gy*P)/P}; }

/* ===================== 操作 ===================== */
let drag=null;
const pointers=new Map();
function isBoardPart(id){ const p=M.partById.get(id); return p && TYPES[p.type].board; }
function pointFree(o){ return o.ends.length===0 && !o.pins.some(q=>!isBoardPart(q.part)); }
function select(s){ sel=s; renderLight(); renderInspector(); renderSteps(); if(s) switchTab('insp',true); }

function startMove(p, w){
  const T=TYPES[p.type];
  const followers=new Set();
  const own=new Set(pinsOf(p).map(q=>K(q.gx,q.gy)));
  if (T.bb){
    for (const o of M.pts.values()) if (o.holes.some(h=>h.part===p.id)) own.add(o.key);
    for (const q of S.parts){ if (TYPES[q.type].board) continue; const ps=pinsOf(q); if (ps.length && ps.every(pp=>{ const o=M.pts.get(K(pp.gx,pp.gy)); return o&&o.holes.some(h=>h.part===p.id); })) followers.add(q.id); }
  }
  for (const id of followers) for (const q of pinsOf(getPart(id))) own.add(K(q.gx,q.gy));
  const ends=[]; for (const wi of S.wires){ if (own.has(K(wi.a[0],wi.a[1]))) ends.push({w:wi,e:'a',o:wi.a.slice()}); if (own.has(K(wi.b[0],wi.b[1]))) ends.push({w:wi,e:'b',o:wi.b.slice()}); }
  drag={mode:'move', start:w, moved:false, parts:[p,...[...followers].map(getPart)].map(q=>({p:q,ox:q.x,oy:q.y})), ends};
}

cv.addEventListener('pointerdown', e=>{
  if (e.button===2) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===2){ const [a,b]=[...pointers.values()]; if(drag&&drag.mode==='move') { for(const it of drag.parts){it.p.x=it.ox;it.p.y=it.oy;} for(const en of drag.ends) en.w[en.e]=en.o; }
    preview=null; drag={mode:'pinch', d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2}; renderLight(); return; }
  hideTip();
  const w=toWorld(e), g=gridOf(w), near=g.d<0.42, o=M.pts.get(K(g.gx,g.gy));
  const t=e.target;
  if (run){
    const pe=t.closest&&t.closest('[data-part]');
    if (pe && pe.dataset.type==='button' && e.button===0){ drag={mode:'press',id:pe.dataset.part}; run.pressed.add(drag.id); updateSim(); return; }
    drag={mode:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty}; cv.classList.add('panning'); return;
  }
  if (e.button===1 || stepMode){ drag={mode:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty}; cv.classList.add('panning'); return; }
  const wend=t.closest&&t.closest('[data-wend]');
  if (wend){ const [id,end]=wend.dataset.wend.split(':'); const wi=getWire(id); sel={kind:'wire',id}; drag={mode:'wend',w:wi,e:end,o:wi[end].slice(),moved:false}; renderLight(); renderInspector(); return; }
  const wireEl=t.closest&&t.closest('[data-wire]');
  if (wireEl){ const wi=getWire(wireEl.dataset.wire); sel={kind:'wire',id:wi.id}; drag={mode:'wmove',w:wi,start:w,a:wi.a.slice(),b:wi.b.slice(),moved:false}; renderLight(); renderInspector(); switchTab('insp',true); return; }
  const partEl=t.closest&&t.closest('[data-part]');
  if (partEl){
    const p=getPart(partEl.dataset.part), T=TYPES[p.type];
    if (near && o){
      if (T.board){
        const mine=o.holes.some(h=>h.part===p.id)||o.pins.some(q=>q.part===p.id);
        if (mine && pointFree(o)){ drag={mode:'wire',a:[g.gx,g.gy],b:[g.gx,g.gy],clickPart:p.id,moved:false}; return; }
      } else {
        const myPin=o.pins.some(q=>q.part===p.id);
        const onBoard=o.holes.length>0 || o.pins.some(q=>q.part!==p.id&&isBoardPart(q.part));
        if (myPin && !onBoard && o.ends.length===0){ drag={mode:'wire',a:[g.gx,g.gy],b:[g.gx,g.gy],clickPart:p.id,moved:false}; return; }
      }
    }
    sel={kind:'part',id:p.id}; startMove(p,w); renderLight(); renderInspector(); renderSteps(); switchTab('insp',true); return;
  }
  if (near && o && o.ends.length){ const en=o.ends[0], wi=getWire(en.w); sel={kind:'wire',id:wi.id}; drag={mode:'wend',w:wi,e:en.e,o:wi[en.e].slice(),moved:false}; renderLight(); return; }
  drag={mode:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,clear:true}; cv.classList.add('panning');
});

window.addEventListener('pointermove', e=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (!drag){ if (e.target===cv || cv.contains(e.target)) updateHover(e); return; }
  if (drag.mode==='pinch'){ if (pointers.size<2) return; const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2; const r=cv.getBoundingClientRect();
    view.tx+=cx-drag.cx; view.ty+=cy-drag.cy; zoomAt(d/drag.d, cx-r.left, cy-r.top); drag.d=d; drag.cx=cx; drag.cy=cy; return; }
  if (drag.mode==='pan'){ view.tx=drag.tx+(e.clientX-drag.sx); view.ty=drag.ty+(e.clientY-drag.sy); if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3) drag.clear=false; applyView(); return; }
  if (drag.mode==='palette'){
    const r=cv.getBoundingClientRect(); const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if (inside){ const w=toWorld(e); const T=TYPES[drag.type]; const [x0,y0,x1,y1]=T.bbox(T.defaults||{});
      const p=addPart(drag.type, Math.round((w.x-(x0+x1)/2)/P), Math.round((w.y-(y0+y1)/2)/P));
      analyze(); sel={kind:'part',id:p.id}; startMove(p,w); drag.moved=true; drag.added=true; renderLight(); }
    return;
  }
  const w=toWorld(e);
  if (drag.mode==='move'){
    const dx=Math.round((w.x-drag.start.x)/P), dy=Math.round((w.y-drag.start.y)/P);
    if (dx||dy) drag.moved=true;
    for (const it of drag.parts){ it.p.x=it.ox+dx; it.p.y=it.oy+dy; }
    for (const en of drag.ends){ en.w[en.e]=[en.o[0]+dx,en.o[1]+dy]; }
    renderLight(); return;
  }
  if (drag.mode==='wmove'){
    const dx=Math.round((w.x-drag.start.x)/P), dy=Math.round((w.y-drag.start.y)/P);
    if (dx||dy) drag.moved=true; drag.w.a=[drag.a[0]+dx,drag.a[1]+dy]; drag.w.b=[drag.b[0]+dx,drag.b[1]+dy]; renderLight(); return;
  }
  const g=gridOf(w);
  if (drag.mode==='wend'){ drag.w[drag.e]=[g.gx,g.gy]; if(g.gx!==drag.o[0]||g.gy!==drag.o[1]) drag.moved=true; renderLight(); return; }
  if (drag.mode==='wire'){
    drag.b=[g.gx,g.gy]; if (g.gx!==drag.a[0]||g.gy!==drag.a[1]) drag.moved=true;
    preview={a:drag.a,b:drag.b,color:autoColor(drag.a)}; drawOverlay();
  }
});
function endDrag(e){
  pointers.delete(e.pointerId);
  if (!drag) return;
  const d=drag; drag=null; cv.classList.remove('panning');
  if (d.mode==='pinch'){ return; }
  if (d.mode==='press'){ if(run){ run.pressed.delete(d.id); updateSim(); } return; }
  if (d.mode==='pan'){ if (d.clear && sel){ select(null); } return; }
  if (d.mode==='palette'){ if (d.added){ commit(); } else if (e.type==='pointerup'){ addAtCenter(d.type); } return; }
  if (d.mode==='move'||d.mode==='wmove'||d.mode==='wend'){ if (d.moved) commit(); else renderLight(); return; }
  if (d.mode==='wire'){
    preview=null;
    if (d.moved){ const wi=addWire(d.a,d.b,autoColor(d.a)); sel={kind:'wire',id:wi.id}; commit(); renderInspector(); }
    else { sel={kind:'part',id:d.clickPart}; renderLight(); renderInspector(); switchTab('insp',true); }
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
cv.addEventListener('pointerleave', ()=>{ if(!drag){ hover=null; hideTip(); renderWires(); drawOverlay(); } });

function autoColor(a){
  const o=M.pts.get(K(a[0],a[1]));
  if (o){
    for (const q of o.pins){ const p=M.partById.get(q.part); if (isMCU(p)){ const r=pinsOf(p)[q.i].role; if(r==='gnd') return '#222222'; if(r==='5v'||r==='3v3') return '#d32f2f'; } }
    const k=kinds(o.root); if (k.gnd) return '#222222'; if (k.v5||k.v33) return '#d32f2f';
  }
  return wireColor;
}

const tip=$('#tip');
function hideTip(){ tip.hidden=true; }
function updateHover(e){
  if (stepMode||run){ return; }
  const w=toWorld(e), g=gridOf(w); const o=g.d<0.45?M.pts.get(K(g.gx,g.gy)):null;
  const key=o?o.key:null;
  if (!o){ if(hover){ hover=null; renderWires(); drawOverlay(); } hideTip(); return; }
  if (!hover||hover.key!==key){ hover={key,root:o.root}; renderWires(); drawOverlay(); }
  let html='';
  for (const q of o.pins){ const p=M.partById.get(q.part), pin=pinsOf(p)[q.i];
    html += isMCU(p) ? `<div><b>${mcuLabel(p)} ${esc(pin.label)}</b></div>` : `<div><b>${esc(dispName(p))}</b>：${esc(pin.label)}</div>`; }
  for (const h of o.holes){ const p=M.partById.get(h.part), L=bbLayout(TYPES[p.type].cols)[h.i];
    html += `<div><b>${esc(L.name.split('（')[0])}</b> ${esc(L.desc)}</div>`; }
  if (o.ends.length) html += `<div>ジャンパ線がささっています</div>`;
  const k=kinds(o.root); const tags=[]; if(k.gnd)tags.push('GND'); if(k.v33)tags.push('3.3V'); if(k.v5)tags.push('5V'); k.gpios.forEach(n=>tags.push('GPIO'+n));
  if (tags.length) html += `<div style="opacity:.8">つながり：${tags.join('・')}</div>`;
  tip.innerHTML=html; tip.hidden=false;
  const r=$('#stage').getBoundingClientRect();
  let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  if (x+260>r.width) x=e.clientX-r.left-260; if (y+80>r.height) y=e.clientY-r.top-70;
  tip.style.left=Math.max(4,x)+'px'; tip.style.top=Math.max(4,y)+'px';
}

function buildPalette(){
  let h='';
  for (const [cat,label] of CATS){
    h+=`<div class="pal-group"><h3>${label}</h3>`;
    for (const [k,T] of Object.entries(TYPES)) if (T.cat===cat)
      h+=`<button class="pal-item" data-type="${k}" title="クリックで追加・ドラッグで好きな位置に"><i style="background:${T.chip}">${T.icon||''}</i><div><b>${esc(T.name)}</b><small>${esc(T.sub||'')}</small></div></button>`;
    h+=`</div>`;
  }
  $('#palette').innerHTML=h;
  $('#palette').addEventListener('pointerdown', e=>{
    const b=e.target.closest('.pal-item'); if(!b||stepMode||run) return; e.preventDefault();
    drag={mode:'palette',type:b.dataset.type,added:false};
  });
  $('#palette').addEventListener('keydown', e=>{ const b=e.target.closest('.pal-item'); if(b&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); addAtCenter(b.dataset.type); } });
}
function addAtCenter(type){
  if (stepMode||run) return;
  const r=cv.getBoundingClientRect(); const w={x:(r.width/2-view.tx)/view.s, y:(r.height/2-view.ty)/view.s};
  const T=TYPES[type]; const [x0,y0,x1,y1]=T.bbox(T.defaults||{});
  const p=addPart(type, Math.round((w.x-(x0+x1)/2)/P), Math.round((w.y-(y0+y1)/2)/P));
  sel={kind:'part',id:p.id}; commit(); switchTab('insp',true);
}

function pinUsage(p){
  const used=pinsOf(p).map((q,i)=>({q,k:kinds(rootT(p,i))})).filter(x=>x.k.terms.length>1&&x.k.terms.some(t=>t.part.id!==p.id));
  if (!used.length) return `<p class="muted small">まだどのピンも使っていません。</p>`;
  return `<h4>使っているピン</h4><ul class="pinlist">`+used.map(({q,k})=>{ const others=[...new Set(k.terms.filter(t=>t.part.id!==p.id).map(t=>dispName(t.part)))].join('・'); return `<li><b>${q.num}番 ${esc(q.name)}</b><span>${esc(others)}</span></li>`; }).join('')+`</ul>`;
}

const lvIcon={error:'×',warn:'!',info:'i',ok:'✓'};

function showCompare(){
  const r=compareAnswer(); const pct=r.total?Math.round(r.match/r.total*100):0;
  const tag=l=>l?l.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<span class="muted">なし</span>';
  let h=`<div class="cmp-row"><b>${r.match} / ${r.total}</b> のつながりがお手本と同じです<div class="meter"><i style="width:${pct}%"></i></div>`;
  h+= (r.match===r.total && !r.pairs.length) ? `<b style="color:var(--ok)">完全に一致しました！</b>` : `ちがうところを下に出しています。`;
  h+=`</div>`;
  for (const [m,e] of r.pairs){
    h+=`<div class="cmp-row">`;
    h+= m ? `<div><b>お手本</b>：${tag(m)} がつながる</div>` : `<div><b>お手本</b>：このつながりはありません</div>`;
    h+= e ? `<div><b>あなた</b>：${tag(e)} がつながっている</div>` : `<div><b>あなた</b>：このつながりがありません</div>`;
    h+=`</div>`;
  }
  $('#cmpOut').innerHTML=h;
}

});

/* ===================== 動かしてみる（シミュレーション） ===================== */
let run=null, simS=null, audio=null, buzz=null, blinkTimer=null;
const VF={red:2.0,yellow:2.1,green:2.2,blue:3.0,white:3.0};
const SENSOR_ROLES=['dout','onewire','echo','aout'];

function gpioUses(){
  const pi=mcuPart(); if(!pi) return [];
  const list=[];
  pinsOf(pi).forEach((q,i)=>{
    if (q.role!=='gpio') return;
    const r=rootT(pi,i), n=M.nets.get(r);
    const others=n.terms.filter(t=>!isMCU(t.part));
    if (!others.length) return;
    const viaRes=viaR(r).flatMap(x=>(M.nets.get(x)?.terms||[]).filter(t=>!isMCU(t.part)&&t.part.type!=='resistor'));
    const all=[...others.filter(t=>t.part.type!=='resistor'),...viaRes];
    list.push({gpio:q.gpio,num:q.num,terms:all,desc:[...new Set(all.map(t=>dispName(t.part)))].join('・')||'抵抗'});
  });
  return list;
}
function defaultMode(u){
  const rs=u.terms;
  if (rs.some(t=>t.pin.role==='sw')) return 'in';
  if (rs.some(t=>t.pin.role==='pwm')) return 'pwm';
  if (rs.some(t=>t.pin.role==='sda'||t.pin.role==='scl')) return 'i2c';
  if (rs.some(t=>SENSOR_ROLES.includes(t.pin.role)||t.part.type==='hcsr04')) return 'sensor';
  return 'out';
}
function initRun(){
  const uses=gpioUses(), g={};
  for (const u of uses){
    const c={mode:defaultMode(u),pull:'up',follow:null,angle:90};
    if (c.mode==='in'){ const bt=u.terms.find(t=>t.pin.role==='sw'); if(bt){ const other=(bt.i===0||bt.i===2)?1:0; const ko=kinds(rootT(bt.part,other)); c.pull=ko.v33&&!ko.gnd?'down':'up'; } }
    g[u.gpio]=c;
  }
  const inputs=uses.filter(u=>g[u.gpio].mode==='in').map(u=>u.gpio);
  for (const u of uses){ const c=g[u.gpio]; if (c.mode==='out'){ if(inputs.length){ c.mode='follow'; c.follow=inputs[0]; } else c.mode='blink'; } }
  return {g,uses,inputs,view:'easy',onboard:false,oledLines:null,env:{temp:23.5,hum:62,soil:45,lux:850,water:18.5,dist:32},text:['HAISEN LAB','HELLO!'],sound:true,pressed:new Set(),phase:true,relayPrev:{}};
}
function simulate(){
  const uf2=new UF(); const F=r=>uf2.find(r);
  for (const id of run.pressed){ const p=getPart(id); if(p) uf2.union(rootT(p,0),rootT(p,1)); }
  const pi=mcuPart();
  const piPins=pi?pinsOf(pi).map((q,i)=>({q,r:F(rootT(pi,i))})):[];
  const res=S.parts.filter(p=>p.type==='resistor').map(p=>[F(rootT(p,0)),F(rootT(p,1)),p.props.ohm]);
  function solve(outVals){
    const strong=new Map(), pwm=new Map(), dutyM=new Map();
    const add=(n,v)=>{ if(!strong.has(n)) strong.set(n,new Set()); strong.get(n).add(v); };
    for (const {q,r} of piPins){
      if (q.role==='3v3') add(r,3.3); else if (q.role==='5v') add(r,5); else if (q.role==='gnd') add(r,0);
      else if (q.role==='gpio'){ const v=outVals[q.gpio]; const c=run.g[q.gpio];
        if (v==='pwm') pwm.set(r,c.angle);
        else if (v==='duty'){ if ((c.freq||1000)<=100){ const ms=c.duty*1000/(c.freq||50); if(ms>0.2) pwm.set(r,Math.max(0,Math.min(180,Math.round((ms-0.5)/2*180)))); else add(r,0); }
          else if (c.duty<=0.001) add(r,0); else { add(r,3.3); dutyM.set(r,Math.min(1,c.duty)); } }
        else if (v!==undefined) add(r,v); }
    }
    const shorts=new Set(); for (const [n,s2] of strong) if (s2.size>1) shorts.add(n);
    const st=n=>{ const x=strong.get(n); return x&&x.size===1?[...x][0]:undefined; };
    const pulls=new Map();
    for (const {q,r} of piPins) if (q.role==='gpio'){ const c=run.g[q.gpio]; if(c&&c.mode==='in'&&c.pull!=='none') pulls.set(r,c.pull==='up'?3.3:0); }
    const level=n=>{
      if (shorts.has(n)) return {short:true};
      const s0=st(n); if (s0!==undefined) return {v:s0,strong:true,R:0,duty:dutyM.get(n)};
      if (pwm.has(n)) return {pwm:pwm.get(n)};
      let best=null;
      for (const [a,b,o] of res){ const other=a===n?b:(b===n?a:null); if(other===null||other===n||shorts.has(other)) continue; const ov=st(other); if(ov!==undefined&&(!best||o<best.R)) best={v:ov,R:o,duty:dutyM.get(other)}; }
      if (best) return best;
      if (pulls.has(n)) return {v:pulls.get(n),R:50000,pull:true};
      return {};
    };
    return {level,shorts};
  }
  const outVals={};
  for (const [k,c] of Object.entries(run.g)){ if(c.mode==='high')outVals[k]=3.3; else if(c.mode==='low')outVals[k]=0; else if(c.mode==='blink')outVals[k]=run.phase?3.3:0; else if(c.mode==='pwm')outVals[k]='pwm'; else if(c.mode==='duty')outVals[k]='duty'; }
  let sol=solve(outVals);
  const pinOf=g=>piPins.find(x=>x.q.gpio===+g);
  const pressedIn=(so,g)=>{ const c=run.g[g], pp=pinOf(g); if(!c||!pp) return false; const L=so.level(pp.r); if(L.v===undefined) return false; return c.pull==='up'? L.v<1.6 : L.v>1.6; };
  let fol=false;
  for (const [k,c] of Object.entries(run.g)) if (c.mode==='follow'){ fol=true; outVals[k]=(c.follow!=null&&pressedIn(sol,c.follow))?3.3:0; }
  if (fol) sol=solve(outVals);
  const lv=(p,i)=>sol.level(F(rootT(p,i)));
  const fx=new Map(), alerts=[], gl={}, pinV={};
  for (const {q,r} of piPins) if (q.role==='gpio') pinV[q.gpio]=sol.level(r);
  for (const {q,r} of piPins) if (q.role==='gpio' && run.g[q.gpio]){
    const c=run.g[q.gpio], L=sol.level(r);
    let o;
    if (c.mode==='pwm') o={t:'PWM '+c.angle+'°',c:'pwm'};
    else if (c.mode==='duty') o={t:(c.freq||1000)<=100?'PWM 50Hz':'PWM '+Math.round(c.duty*100)+'%',c:'pwm'};
    else if (c.mode==='i2c') o={t:'I2C',c:'pwm'};
    else if (c.mode==='sensor') o={t:'センサー',c:'pwm'};
    else if (L.short) o={t:'ショート',c:'err'};
    else if (L.v===undefined) o={t:'不定',c:'na'};
    else o= L.v>1.6?{t:'HIGH',c:'hi'}:{t:'LOW',c:'lo'};
    if (c.mode==='in'){ o.pressed=pressedIn(sol,q.gpio); if (L.v===undefined) alerts.push(['warn',`${GN(q.gpio)}：入力が不定です（フローティング）。プルアップかプルダウンを選びましょう`]); }
    gl[q.gpio]=o;
  }
  if (sol.shorts.size) alerts.push(['error','ショートしています！ 電源やHIGHのGPIOが、GNDやLOWのGPIOと直接つながっています']);
  const pinIdx=(p,role)=>pinsOf(p).findIndex(q=>q.role===role);
  const powered=p=>{ let v=0, g=false; pinsOf(p).forEach((q,i)=>{ const L=lv(p,i); if((q.role==='vcc'||q.role==='vcc5')&&L.strong) v=L.v; if(q.role==='gnd'&&L.strong&&L.v===0) g=true; }); return g&&v>=3?v:0; };
  const mk=pi&&pi.type==='pico'?'pico':'pi';
  const i2cOk=p=>kinds(rootT(p,pinIdx(p,'sda'))).gpios.some(g=>I2C_SDA[mk].includes(g))&&kinds(rootT(p,pinIdx(p,'scl'))).gpios.some(g=>I2C_SCL[mk].includes(g));
  const sigGpio=(p,role)=>{ const i=pinIdx(p,role); if(i<0) return false; const r=rootT(p,i); return kinds(r).gpios.length>0||viaR(r).some(x=>kinds(x).gpios.length>0); };
  const E=run.env;
  for (const p of S.parts){
    const nm=dispName(p);
    switch(p.type){
      case 'led': { const a=lv(p,0), k=lv(p,1); let o=0, burnt=false;
        if (a.v!==undefined&&k.v!==undefined){ const d=a.v-k.v, vf=VF[p.props.color]||2;
          if (d>=vf){ if (a.strong&&k.strong){ burnt=true; alerts.push(['error',`${nm}：抵抗がないので電流が流れすぎて、壊れてしまいました（シミュレーション）`]); }
            else { const I=(d-vf)/((a.R||0)+(k.R||0)); if (I>0.0002) o=Math.min(1,0.3+I/0.012)*(a.duty!==undefined?Math.max(0.08,a.duty):1); if (I>0.016) alerts.push(['warn',`${nm}：電流が約${Math.round(I*1000)}mAです。GPIOには大きすぎるので、抵抗を大きくしましょう`]); } }
          else if (d>1.5) alerts.push(['info',`${nm}：電圧が足りずに暗い、または光りません（青・白のLEDは約3Vが必要）`]); }
        fx.set(p.id,{o,burnt}); break; }
      case 'buzzer': { const a=lv(p,0), k=lv(p,1); fx.set(p.id,{on:a.v!==undefined&&k.v!==undefined&&a.v-k.v>=2.5}); break; }
      case 'button': fx.set(p.id,{pressed:run.pressed.has(p.id)}); break;
      case 'relay': { const pw=powered(p), L=lv(p,pinIdx(p,'din')); const hi=L.v!==undefined&&L.v>1.6, lo=L.v!==undefined&&L.v<1.6;
        const on=pw>0&&(p.props.trig==='low'?lo:hi); fx.set(p.id,{on,tag:!pw?'電源なし':on?'ON：NOとCOMがつながる':'OFF'}); break; }
      case 'servo': { const pw=powered(p), L=lv(p,pinIdx(p,'pwm'));
        fx.set(p.id,{angle:pw&&L.pwm!==undefined?L.pwm:null,tag:!pw?'電源なし':L.pwm!==undefined?`${L.pwm}°`:'PWMで角度を指定'}); break; }
      case 'dht22': { const pw=powered(p), s1=sigGpio(p,'dout'); fx.set(p.id,{ok:!!(pw&&s1),tag:!pw?'電源なし':s1?`${E.temp.toFixed(1)}℃　${Math.round(E.hum)}%`:'OUTをGPIOへ'}); break; }
      case 'soil': { const pw=powered(p); const v=(2.8-E.soil/100*1.6)*(pw>=4.5?1.5:1); p._aout=pw?v:null; fx.set(p.id,{ok:!!pw,tag:pw?`AOUT ${v.toFixed(2)}V（水分${Math.round(E.soil)}%）`:'電源なし'}); break; }
      case 'bh1750': { const pw=powered(p), ok=!!(pw&&i2cOk(p)); fx.set(p.id,{ok,tag:!pw?'電源なし':ok?`${Math.round(E.lux)} lx`:'I2Cの配線を確認'}); break; }
      case 'ds18b20': { const pw=powered(p), r=rootT(p,pinIdx(p,'onewire')); const g=kinds(r).gpios.length>0, pu=viaR(r).some(x=>kinds(x).v33);
        fx.set(p.id,{ok:!!(pw&&g&&pu),tag:!pw?'電源なし':!g?'DATAをGPIOへ':!pu?'読めない（プルアップ抵抗なし）':`${E.water.toFixed(1)}℃`}); break; }
      case 'hcsr04': { const pw=powered(p), ok=pw>=4.5&&sigGpio(p,'din')&&sigGpio(p,'echo');
        fx.set(p.id,{ok,tag:!pw?'電源なし':pw<4.5?'5Vが必要':ok?`${Math.round(E.dist)} cm`:'TrigとEchoをGPIOへ'}); break; }
      case 'lcd': case 'oled': { const pw=powered(p); fx.set(p.id,{pw,ok:!!(pw&&i2cOk(p))}); break; }
    }
  }
  return {fx,alerts,gl,pinV};
}

function fxSVG(p){
  const d=run&&simS?simS.fx.get(p.id):null, T=TYPES[p.type], rot=p.rot||0;
  const bubble=(txt,ok)=>{ const [x0,y0,x1]=T.bbox(p.props); const cx=(x0+x1)/2; const w=[...txt].reduce((s2,c)=>s2+(c.charCodeAt(0)>255?12.5:7.4),0)+20;
    return `<g transform="translate(${cx} ${y0-18}) rotate(${-rot*90})"><rect x="${-w/2}" y="-13" width="${w}" height="24" rx="12" class="bub ${ok?'ok':'ng'}"/><text x="0" y="4" text-anchor="middle" class="bubt">${esc(txt)}</text></g>`; };
  switch(p.type){
    case 'pi': case 'pico': { if(!run||!simS) return ''; let s='';
      if (p.type==='pico' && run.onboard) s+=`<circle cx="16" cy="29" r="16" fill="#5dff7a" opacity=".8" filter="url(#glowf)"/><rect x="10" y="26" width="12" height="7" rx="1" fill="#eaffea"/>`;
      for (const q of (p.type==='pico'?PICO_PINS:PI_PINS)){ const g=q.role==='gpio'?simS.gl[q.gpio]:null; if(!g) continue;
        const col={hi:'#e53935',lo:'#2f62c9',na:'#8a8f93',pwm:'#8e44ad',err:'#ff1f1f'}[g.c];
        s+=`<circle cx="${q.x*P}" cy="${q.y*P}" r="8.5" fill="${col}" stroke="#fff" stroke-width="1.5"/><text x="${q.x*P}" y="${q.y*P+3.5}" text-anchor="middle" class="pibadge">${{hi:'H',lo:'L',na:'?',err:'!',pwm:'~'}[g.c]}</text>`; }
      return s; }
    case 'led': { if(!d) return ''; const c=LED_COLORS[p.props.color]?.c||'#e53935';
      if (d.burnt) return `<path d="M-2 -24 L-2 -42 A12 12 0 0 1 22 -42 L22 -24 Z" fill="#333" opacity=".9"/><text x="10" y="-29" text-anchor="middle" class="bubt">×</text>`;
      if (!d.o) return '';
      return `<circle cx="10" cy="-36" r="30" fill="${c}" opacity="${(d.o*0.8).toFixed(2)}" filter="url(#glowf)"/><path d="M-2 -24 L-2 -42 A12 12 0 0 1 22 -42 L22 -24 Z" fill="#fff" opacity="${(d.o*0.6).toFixed(2)}"/>`; }

      return `<text x="56" y="-206" class="lcdt">${esc((run.text[0]||'').slice(0,16))}</text><text x="56" y="-152" class="lcdt">${esc((run.text[1]||'').slice(0,16))}</text>`; }

    case 'dht22': case 'soil': case 'bh1750': case 'ds18b20': case 'hcsr04': return d?bubble(d.tag,d.ok):'';
  }

}

'gpiozero.py': `import _hw, _rt

class GPIOZeroError(Exception):

def _pin(p):
    if isinstance(p, str):
        s = p.upper()
        if s.startswith("GPIO"):
            return int(s[4:])
        if s.startswith("BCM"):
            return int(s[3:])
