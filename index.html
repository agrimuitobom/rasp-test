class Device:
    def close(self):
        pass
    def __enter__(self):
        return self
    def __exit__(self, *args):
        self.close()

class OutputDevice(Device):
    def __init__(self, pin=None, active_high=True, initial_value=False, pin_factory=None):
        self.pin = _pin(pin)
        self.active_high = active_high
        self._v = 0
        self._blink = None
        _hw.setup(self.pin, "out", "")
        self._set(1 if initial_value else 0)
        _rt._pollers.append(self._tick)
    def _out(self, v):
        lvl = v if self.active_high else (0 if v else 1)
        _hw.write(self.pin, lvl)
    def _set(self, v):
        self._v = v
        self._out(v)
    def on(self):
        self._blink = None
        self._set(1)
    def off(self):
        self._blink = None
        self._set(0)
    def toggle(self):
        self._blink = None
        self._set(0 if self._v else 1)
    def _get_value(self):
        return self._v
    def _set_value(self, v):
        self._blink = None
        self._set(v)
    value = property(_get_value, _set_value)
    def _is_active(self):
        return bool(self._v)
    is_active = property(_is_active)
    is_lit = property(_is_active)
    def blink(self, on_time=1, off_time=1, n=None, background=True):
        self._set(1)
        self._blink = [on_time, off_time, n, _hw.ticks(), 1]
        if not background:
            while self._blink is not None:
                _rt.sleep(0.02)
    def beep(self, on_time=1, off_time=1, n=None, background=True):
        self.blink(on_time, off_time, n, background)
    def _tick(self):
        b = self._blink
        if b is None:
            return
        dur = (b[0] if b[4] else b[1]) * 1000
        if _hw.ticks() - b[3] >= dur:
            b[3] = _hw.ticks()
            b[4] = 0 if b[4] else 1
            if b[4] == 1 and b[2] is not None:
                b[2] = b[2] - 1
                if b[2] <= 0:
                    self._blink = None
                    self._set(0)
                    return
            self._set(b[4])
            self._blink = b
    def close(self):
        self._blink = None
        _hw.write(self.pin, 0)

DigitalOutputDevice = OutputDevice

class LED(OutputDevice):
    pass

class Buzzer(OutputDevice):
    pass

class PWMOutputDevice(OutputDevice):
    def __init__(self, pin=None, active_high=True, initial_value=0, frequency=100, pin_factory=None):
        self.frequency = frequency
        OutputDevice.__init__(self, pin, active_high, initial_value)
    def _out(self, v):
        v = max(0, min(1, float(v)))
        _hw.duty(self.pin, v if self.active_high else 1 - v, self.frequency)
    def pulse(self, fade_in_time=1, fade_out_time=1, n=None, background=True):
        self.blink(fade_in_time, fade_out_time, n, background)

class PWMLED(PWMOutputDevice):
    pass

class InputDevice(Device):
    def __init__(self, pin=None, pull_up=False, active_state=None, bounce_time=None, hold_time=1, pin_factory=None):
        self.pin = _pin(pin)
        self.pull_up = pull_up
        _hw.setup(self.pin, "in", "up" if pull_up else ("down" if pull_up is False else "none"))
        self.when_pressed = None
        self.when_released = None
        self.when_activated = None
        self.when_deactivated = None
        self._last = self._active()
        _rt._pollers.append(self._tick)
    def _active(self):
        v = _hw.read(self.pin)
        return (not v) if self.pull_up else bool(v)
    def _p(self):
        return self._active()
    is_pressed = property(_p)
    is_active = property(_p)
    def _val(self):
        return 1 if self._active() else 0
    value = property(_val)
    def wait_for_press(self, timeout=None):
        while not self._active():
            _rt.sleep(0.02)
    def wait_for_release(self, timeout=None):
        while self._active():
            _rt.sleep(0.02)
    wait_for_active = wait_for_press
    wait_for_inactive = wait_for_release
    def _tick(self):
        p = self._active()
        if p != self._last:
            self._last = p
            cb = (self.when_pressed or self.when_activated) if p else (self.when_released or self.when_deactivated)
            if cb is not None:

  ds18(p){ const n=p==null?null:HW.pin(p); const s=HW.sensorOn('ds18b20','onewire',n); if(!s) return null; return Math.round((run.env.water+(Math.random()-0.5)*0.1)*100)/100; },
  dist(t,e){ const tn=HW.pin(t), en=HW.pin(e); simS=simulate();
    const s=S.parts.find(p=>{ if(p.type!=='hcsr04') return false; const d=simS.fx.get(p.id); if(!d||!d.ok) return false;
      const ti=pinsOf(p).findIndex(q=>q.role==='din'), ei=pinsOf(p).findIndex(q=>q.role==='echo');
      const hit=(i,g)=>{ const r=rootT(p,i); return kinds(r).gpios.includes(g)||viaR(r).some(x=>kinds(x).gpios.includes(g)); };
      return hit(ti,tn)&&hit(ei,en); });
    if (!s){ if(!HW.warned.has('dist')){ HW.warned.add('dist'); conLine('注意：距離センサーのTrig/Echoの配線とピン番号が合っていません','warn'); } return null; }
    return run.env.dist+(Math.random()-0.5)*0.4; },
  i2cscan(sda,scl){ simS=simulate(); const out=[];
    const mk=isPicoCircuit()?'pico':'pi';
    for (const p of S.parts){ if(!['lcd','oled','bh1750'].includes(p.type)) continue; const d=simS.fx.get(p.id); if(!d||!d.ok) continue;
      if (sda!=null){ const a=kinds(rootT(p,pinsOf(p).findIndex(q=>q.role==='sda'))).gpios, b=kinds(rootT(p,pinsOf(p).findIndex(q=>q.role==='scl'))).gpios; if(!a.includes(HW.pin(sda))||!b.includes(HW.pin(scl))) continue; }
      out.push(p.type==='lcd'?0x27:p.type==='oled'?0x3c:0x23); }
    return out; },
  lcd(a,b){ run.text=[a,b]; markSim(); },
  oled(lines){ run.oledLines=lines; markSim(); },
};
window.__hwModule = function(){
  const mod={}, J=x=>Sk.ffi.remapToJs(x), none=Sk.builtin.none.none$;
  const fn=f=>new Sk.builtin.func((...a)=>{ if(!run) throw new Sk.builtin.SystemExit('停止'); return f(...a); });
  const py=v=> v===null||v===undefined ? none : Array.isArray(v) ? new Sk.builtin.list(v.map(py)) : typeof v==='boolean' ? (v?Sk.builtin.bool.true$:Sk.builtin.bool.false$) : typeof v==='number' ? (Number.isInteger(v)?new Sk.builtin.int_(v):new Sk.builtin.float_(v)) : new Sk.builtin.str(String(v));
  mod.ticks=fn(()=>new Sk.builtin.float_(performance.now()));
  mod.wait=fn(ms=>Sk.misceval.promiseToSuspension(new Promise((res,rej)=>setTimeout(()=>{ if(HW.stop) rej(new Sk.builtin.SystemExit('停止')); else res(none); }, Math.max(1,J(ms)))))) ;
  mod.setup=fn((p,k,u)=>{ HW.setup(J(p),J(k),J(u)); return none; });
  mod.write=fn((p,v)=>{ HW.write(J(p),J(v)); return none; });
  mod.read=fn(p=>py(HW.read(J(p))));
  mod.duty=fn((p,d,f)=>{ HW.duty(J(p),J(d),J(f)); return none; });
  mod.angle=fn((p,a)=>{ HW.angle(J(p),J(a)); return none; });
  mod.adc=fn(p=>py(HW.adc(J(p))));
  mod.dht=fn(p=>{ const r=HW.dht(J(p)); return r?new Sk.builtin.tuple([py(r[0]),py(r[1])]):none; });
  mod.ds18=fn(p=>py(HW.ds18(J(p))));
  mod.dist=fn((t,e)=>py(HW.dist(J(t),J(e))));
  mod.i2cscan=fn((a,b)=>py(HW.i2cscan(J(a),J(b))));
  mod.lcd=fn((a,b)=>{ HW.lcd(J(a),J(b)); return none; });
  mod.oled=fn(l=>{ HW.oled(J(l)); return none; });
  return mod;
};

let simQueued=false;
function markSim(){ if(simQueued) return; simQueued=true; requestAnimationFrame(()=>{ simQueued=false; updateSim(); }); }

/* ===================== Skulptの読み込みと実行 ===================== */
let skLoading=null, codeRunning=false, killTimer=null;
function loadSkulpt(){
  if (window.Sk && Sk.misceval && Sk.builtinFiles) return Promise.resolve();
  if (skLoading) return skLoading;
  const add=src=>new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('load')); document.head.appendChild(sc); });
  skLoading=add('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js').then(()=>add('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js')).catch(e=>{ skLoading=null; throw e; });
  return skLoading;
}
function skRead(path){
  const m=path.match(/^src\/(?:lib|builtin)\/(.+)$/);
  if (m){ const rel=m[1];
    if (PYMODS[rel]!==undefined) return PYMODS[rel];
    if (/^(time|utime|signal)(\.js|\/__init__\.(py|js))$/.test(rel)) throw new Error('blocked'); }
  if (Sk.builtinFiles && Sk.builtinFiles.files[path]!==undefined) return Sk.builtinFiles.files[path];
  throw new Error('File not found: '+path);
}
const conBuf=[];
function conLine(t,cls){ conBuf.push([t,cls||'']); if(conBuf.length>400) conBuf.splice(0,conBuf.length-400); paintCon(); }
let conPartial='';
function conOut(t){ conPartial+=t; const parts=conPartial.split('\n'); conPartial=parts.pop(); for(const l of parts) conBuf.push([l,'']); if(conBuf.length>400) conBuf.splice(0,conBuf.length-400); paintCon(); }
let conQueued=false;
function paintCon(){ if(conQueued) return; conQueued=true; requestAnimationFrame(()=>{ conQueued=false; const el=$('#cOut'); if(!el) return;
  const atEnd=el.scrollTop+el.clientHeight>=el.scrollHeight-20;
  el.innerHTML=conBuf.map(([t,c])=>`<div class="${c}">${esc(t)||'&nbsp;'}</div>`).join('')+(conPartial?`<div>${esc(conPartial)}</div>`:'');
  if(atEnd) el.scrollTop=el.scrollHeight; }); }
const ERR_HINT = {
  NameError:'名前が見つかりません。つづりのまちがいや、import のし忘れがないか確認しましょう',
  SyntaxError:'文法のまちがいです。コロン（:）、かっこの閉じ忘れ、全角の文字や空白が入っていないか確認しましょう',
  IndentationError:'インデント（行の先頭の空白）がそろっていません。スペース4つずつにそろえましょう',
  TabError:'タブとスペースがまざっています。スペースにそろえましょう',
  ImportError:'このアプリでは使えないライブラリです',
  ModuleNotFoundError:'このアプリでは使えないライブラリです',
  AttributeError:'その部品（オブジェクト）にない名前を使っています。つづりを確認しましょう',
  TypeError:'値の種類や、関数にわたす値の数がちがいます',
  ValueError:'値が正しくありません。ピン番号などを確認しましょう',
  RuntimeError:'センサーから読めませんでした。配線を確認しましょう（実物でもときどき起きます。try: で囲むと止まらずにすみます）',
  IOError:'デバイスから応答がありません。配線を確認しましょう',
  NoSensorFoundError:'センサーが見つかりません。配線とプルアップ抵抗を確認しましょう',
  ZeroDivisionError:'0で割り算しています',
};
function conErr(e){
  let name=e&&e.tp$name, msg='', line=null;
  try{ msg=e.toString(); }catch(_){ msg=String(e); }
  if (e&&e.traceback&&e.traceback.length){ const f=e.traceback.find(t=>/stdin/.test(t.filename||''))||e.traceback[0]; line=f.lineno; }
  msg=msg.replace(/ on line \d+$/,'').replace(/^IOError/,'OSError');
  conLine('エラー：'+msg,'err');
  if (line) conLine(`→ ${line}行目を見てみましょう`,'err');
  const h=ERR_HINT[name]||(/Error/.test(msg)?'':null); if(h) conLine('ヒント：'+h,'hint');
  if (name==='ImportError'||name==='ModuleNotFoundError') conLine(isPicoCircuit()?'使えるもの：machine, time, dht, onewire, ds18x20, ssd1306, math, random':'使えるもの：gpiozero, time, signal, adafruit_dht, board, RPLCD.i2c, w1thermsensor, math, random','hint');
  markErrLine(line);
}
async function runCode(){
  if (codeRunning||!run) return;
  const src=$('#cCode').value; saveCode(src);
  conBuf.length=0; conPartial=''; markErrLine(null);
  conLine(`▶ 実行します（${isPicoCircuit()?'Pico W・MicroPython':'Raspberry Pi・Python'}）`,'sys');
  if (/gpiozero/.test(src)&&isPicoCircuit()) conLine('注意：この回路はPico Wです。Picoでは gpiozero ではなく machine を使います','warn');
  if (/from machine|import machine/.test(src)&&!isPicoCircuit()) conLine('注意：machine はPico（MicroPython）用です。ラズパイでは gpiozero を使います','warn');
  if (/[　（）：]/.test(src.replace(/(["'])(?:\\.|(?!\1).)*\1/g,'').replace(/#.*$/gm,''))) conLine('注意：プログラムの中に全角の文字（空白・かっこ・コロン）があるようです','warn');
  try{ await loadSkulpt(); }catch(e){ conLine('Pythonの実行環境を読み込めませんでした。ネットワークを確認して、もう一度ためしてください','err'); return; }
  HW.stop=false; HW.kill=false; HW.warned=new Set();
  for (const k of Object.keys(run.g)) delete run.g[k];
  run.onboard=false; run.oledLines=null; run.text=['','']; updateSim();
  Sk.configure({ output:conOut, read:skRead, __future__:Sk.python3, yieldLimit:25, execLimit:null, killableWhile:true, killableFor:true });
  Sk.builtins.OSError=Sk.builtin.IOError; Sk.builtins.KeyboardInterrupt=Sk.builtin.SystemExit;
  codeRunning=true; codeButtons();
  let stopped=false, errored=false;
  try{
    await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,src,true), {'*':()=>{ if(HW.kill) throw new Sk.builtin.SystemExit('停止'); }});
    if (conPartial){ conBuf.push([conPartial,'']); conPartial=''; }
    if (HW.stop){ stopped=true; conLine('■ 停止しました','sys'); }
    else conLine('— プログラムが終わりました —','sys');
  }catch(e){
    if (conPartial){ conBuf.push([conPartial,'']); conPartial=''; }
    if (HW.stop || (e&&e.tp$name==='SystemExit')){ stopped=true; conLine('■ 停止しました','sys'); }
    else { errored=true; conErr(e); }
  }finally{
    clearTimeout(killTimer); codeRunning=false; codeButtons();
    if (run){
      const pico=isPicoCircuit();
      if (!pico || stopped){ for (const k of Object.keys(run.g)) delete run.g[k]; run.onboard=false; if(!pico&&!errored) conLine(stopped?'（ラズパイでは止めるとGPIOが元にもどります）':'（gpiozeroはプログラムが終わるとGPIOを元にもどします。動かし続けるには pause() や while True: を使います）','hint'); }
      updateSim();
    }
  }
}
function stopCode(){
  if (!codeRunning) return;
  HW.stop=true; clearTimeout(killTimer); killTimer=setTimeout(()=>{ HW.kill=true; },400);
}
function codeButtons(){ const r=$('#cRun'), s=$('#cStop'); if(r) r.disabled=codeRunning; if(s) s.disabled=!codeRunning; const st=$('#cState'); if(st) st.textContent=codeRunning?'実行中':''; }
function saveCode(src){ if(S.code===src) return; S.code=src; lastSnap=snap(); store.set('haisenlab.v1',lastSnap); }
function markErrLine(n){ const g=$('#cLn'); if(!g) return; g.querySelectorAll('.e').forEach(x=>x.classList.remove('e')); if(n){ const x=g.children[n-1]; if(x) x.classList.add('e'); } }
function paintGutter(){ const ta=$('#cCode'), g=$('#cLn'); if(!ta||!g) return; const n=ta.value.split('\n').length; if(g.children.length!==n) g.innerHTML=Array.from({length:n},(_,i)=>`<span>${i+1}</span>`).join(''); g.scrollTop=ta.scrollTop; }
function setupEditor(){
  const ta=$('#cCode'); if(!ta) return;
  paintGutter();
  ta.addEventListener('input',()=>{ paintGutter(); clearTimeout(ta._t); ta._t=setTimeout(()=>saveCode(ta.value),500); });
  ta.addEventListener('scroll',()=>{ $('#cLn').scrollTop=ta.scrollTop; });
  ta.addEventListener('keydown',e=>{
    if (e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart, en=ta.selectionEnd;
      if (e.shiftKey){ const ls=ta.value.lastIndexOf('\n',s-1)+1; if(ta.value.slice(ls,ls+4)==='    '){ ta.setRangeText('',ls,ls+4,'end'); ta.selectionStart=ta.selectionEnd=Math.max(ls,s-4); } }
      else ta.setRangeText('    ',s,en,'end');
      paintGutter(); }
    else if ((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runCode(); }
    else if (e.key==='Enter'){ const s=ta.selectionStart; const ls=ta.value.lastIndexOf('\n',s-1)+1; const line=ta.value.slice(ls,s);
      let ind=(line.match(/^ */)||[''])[0]; if (/:\s*(#.*)?$/.test(line)) ind+='    ';
      e.preventDefault(); ta.setRangeText('\n'+ind,s,ta.selectionEnd,'end'); paintGutter(); }
  });
}

/* ===================== 起動 ===================== */
function boot(){
  buildPalette(); buildSwatches();
  if (store.get('haisenlab.hint')==='0') $('#hint').hidden=true;
  try{ const a=store.get('haisenlab.answer'); if(a) answer=JSON.parse(a); }catch(e){}
  let st=null;
  try{ const q=new URLSearchParams(location.search).get('c'); if(q) st=deserialize(fromCode(q)); }catch(e){}
  if (!st){ try{ const s=store.get('haisenlab.v1'); if(s){ const o=JSON.parse(s); if(o&&o.p&&o.p.length) st=deserialize(o); } }catch(e){} }
  if (!st) st=sample();
  loadState(st); lastSnap=snap(); hist=[]; fut=[];
  afterChange(); applyView();
  requestAnimationFrame(fitView);
}
boot();
